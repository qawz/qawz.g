<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师端 · 班级管理</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        .login-container h2 { margin-bottom: 20px; color: #333; }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-container .error { color: red; margin-top: 10px; }
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            display: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 { color: #333; }
        .nav a {
            color: #667eea;
            text-decoration: none;
            margin-left: 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        th { background: #f1f5f9; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .status-pending { background: #fff3cd; color: #856404; padding: 4px 10px; border-radius: 20px; }
        .status-approved { background: #d4edda; color: #155724; padding: 4px 10px; border-radius: 20px; }
        .status-rejected { background: #f8d7da; color: #721c24; padding: 4px 10px; border-radius: 20px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
        }
        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .search-box {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 250px;
            margin-bottom: 15px;
        }
        .checkbox-col {
            width: 40px;
            text-align: center;
        }
        .type-badge-add {
            background: #d4edda;
            color: #155724;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .type-badge-subtract {
            background: #f8d7da;
            color: #721c24;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="loginContainer" class="login-container">
        <h2>教师登录</h2>
        <input type="text" id="username" placeholder="用户名" value="admin">
        <input type="password" id="password" placeholder="密码">
        <button onclick="teacherLogin()">登录</button>
        <p id="loginError" class="error"></p>
    </div>

    <div id="mainContainer" class="main-container">
        <div class="header">
            <h1>📊 班级管理 · 教师端</h1>
            <div class="nav">
                <a href="#" onclick="teacherLogout()">退出登录</a>
            </div>
        </div>

        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('rules')">📋 规则管理</button>
            <button class="tab-btn" onclick="switchTab('students')">👥 学生管理</button>
            <button class="tab-btn" onclick="switchTab('applications')">📬 申请审核</button>
            <button class="tab-btn" onclick="switchTab('rank')">🏆 积分排名</button>
        </div>

        <!-- 规则管理 -->
        <div id="rulesPanel" class="panel active">
            <div class="card">
                <div class="card-header">
                    <h2>加分/扣分规则管理</h2>
                    <button class="btn btn-primary" id="addRuleBtn">➕ 新建规则</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>类型</th>
                            <th>名称</th>
                            <th>描述</th>
                            <th>分值</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="rulesList"></tbody>
                </table>
            </div>
        </div>

        <!-- 学生管理 -->
        <div id="studentsPanel" class="panel">
            <div class="card">
                <div class="card-header">
                    <h2>学生列表</h2>
                    <div>
                        <button class="btn btn-warning" onclick="toggleSelectAll()">全选/取消全选</button>
                        <button class="btn btn-danger" onclick="clearSelectedPoints()">积分清零（选中）</button>
                        <input type="text" id="studentSearch" class="search-box" placeholder="搜索学号或姓名">
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th class="checkbox-col"><input type="checkbox" id="selectAllCheckbox" onclick="toggleAllCheckboxes()"></th>
                            <th>学号</th>
                            <th>姓名</th>
                            <th>班级</th>
                            <th>积分</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="studentsList"></tbody>
                </table>
            </div>
        </div>

        <!-- 申请审核 -->
        <div id="applicationsPanel" class="panel">
            <div class="card">
                <h2>待审核申请</h2>
                <table>
                    <thead>
                        <tr>
                            <th>学生</th>
                            <th>项目</th>
                            <th>类型</th>
                            <th>分值</th>
                            <th>理由</th>
                            <th>申请时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="pendingList"></tbody>
                </table>
            </div>
            <div class="card">
                <div class="card-header">
                    <h2>已审核记录</h2>
                    <input type="text" id="historySearch" class="search-box" placeholder="搜索学生姓名或学号">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>学生</th>
                            <th>项目</th>
                            <th>类型</th>
                            <th>分值</th>
                            <th>理由</th>
                            <th>状态</th>
                            <th>审核时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyList"></tbody>
                </table>
            </div>
        </div>

        <!-- 积分排名 -->
        <div id="rankPanel" class="panel">
            <div class="card">
                <h2>积分排名</h2>
                <table>
                    <thead><tr><th>排名</th><th>学号</th><th>姓名</th><th>班级</th><th>积分</th></tr></thead>
                    <tbody id="rankList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 规则编辑模态框 -->
    <div id="ruleModal" class="modal">
        <div class="modal-content">
            <h3 id="ruleModalTitle">新建规则</h3>
            <input type="hidden" id="ruleId">
            <label>规则类型</label>
            <select id="ruleType">
                <option value="add">➕ 加分规则</option>
                <option value="subtract">➖ 扣分规则</option>
            </select>
            <label>规则名称</label><input type="text" id="ruleName">
            <label>描述</label><textarea id="ruleDesc" rows="2"></textarea>
            <label>分值</label><input type="number" id="rulePoints" value="5" min="1">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn btn-success" id="saveRuleBtn">保存</button>
                <button class="btn btn-danger" id="closeRuleModalBtn">取消</button>
            </div>
        </div>
    </div>

    <!-- 学生编辑模态框 -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h3>编辑学生</h3>
            <input type="hidden" id="editStudentId">
            <label>姓名</label><input type="text" id="editStudentName">
            <label>班级</label><input type="text" id="editStudentClass">
            <label>调整积分</label><input type="number" id="editStudentPoints" value="0" placeholder="正加负减">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn btn-success" id="saveStudentBtn">保存</button>
                <button class="btn btn-danger" id="closeStudentModalBtn">取消</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- Supabase 配置 ----------
            const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            let isTeacherLoggedIn = false;

            // ---------- 登录/登出 ----------
            async function teacherLogin() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                try {
                    const { data, error } = await supabaseClient
                        .from('config')
                        .select('admin_password')
                        .eq('id', 1)
                        .single();
                    if (error || !data) throw error || new Error('无法验证');
                    if (username === 'admin' && password === data.admin_password) {
                        isTeacherLoggedIn = true;
                        sessionStorage.setItem('teacherLoggedIn', 'true');
                        document.getElementById('loginContainer').style.display = 'none';
                        document.getElementById('mainContainer').style.display = 'block';
                        loadRules();
                        loadStudents();
                        loadApplications();
                        loadRank();
                    } else {
                        document.getElementById('loginError').innerText = '用户名或密码错误';
                    }
                } catch (err) {
                    console.error('登录错误:', err);
                    document.getElementById('loginError').innerText = '系统错误，请稍后重试';
                }
            }

            function teacherLogout() {
                sessionStorage.removeItem('teacherLoggedIn');
                location.reload();
            }

            function checkTeacherLogin() {
                if (sessionStorage.getItem('teacherLoggedIn') === 'true') {
                    isTeacherLoggedIn = true;
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('mainContainer').style.display = 'block';
                    loadRules();
                    loadStudents();
                    loadApplications();
                    loadRank();
                } else {
                    document.getElementById('loginContainer').style.display = 'block';
                    document.getElementById('mainContainer').style.display = 'none';
                }
            }

            // ---------- 标签页切换 ----------
            window.switchTab = function(tab) {
                console.log('切换标签页:', tab);
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(tab + 'Panel').classList.add('active');
                document.querySelector(`.tab-btn[onclick*="'${tab}'"]`).classList.add('active');
            };

            // ---------- 规则管理 ----------
            async function loadRules() {
                console.log('加载规则列表');
                try {
                    const { data: rules, error } = await supabaseClient
                        .from('point_rules')
                        .select('*')
                        .order('type')
                        .order('id');
                    if (error) throw error;
                    const tbody = document.getElementById('rulesList');
                    tbody.innerHTML = '';
                    if (!rules || rules.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">暂无规则</td></tr>';
                        return;
                    }
                    rules.forEach(rule => {
                        const tr = document.createElement('tr');
                        const typeClass = rule.type === 'add' ? 'type-badge-add' : 'type-badge-subtract';
                        const typeText = rule.type === 'add' ? '加分' : '扣分';
                        tr.innerHTML = `
                            <td><span class="${typeClass}">${typeText}</span></td>
                            <td>${rule.name}</td>
                            <td>${rule.description || '-'}</td>
                            <td>${rule.points}</td>
                            <td><span style="background:${rule.enabled ? '#d4edda' : '#f8d7da'}; color:${rule.enabled ? '#155724' : '#721c24'}; padding:4px 10px; border-radius:20px;">${rule.enabled ? '启用' : '禁用'}</span></td>
                            <td>
                                <button class="btn btn-success btn-sm" data-action="editRule" data-id="${rule.id}">编辑</button>
                                <button class="btn btn-warning btn-sm" data-action="toggleRule" data-id="${rule.id}">${rule.enabled ? '禁用' : '启用'}</button>
                                <button class="btn btn-danger btn-sm" data-action="deleteRule" data-id="${rule.id}">删除</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } catch (err) {
                    console.error('加载规则失败:', err);
                    alert('加载规则失败：' + err.message);
                }
            }

            window.editRule = async function(id) {
                console.log('编辑规则 ID:', id);
                try {
                    const { data: rule, error } = await supabaseClient
                        .from('point_rules')
                        .select('*')
                        .eq('id', id)
                        .single();
                    if (error) throw error;
                    document.getElementById('ruleModalTitle').innerText = '编辑规则';
                    document.getElementById('ruleId').value = rule.id;
                    document.getElementById('ruleType').value = rule.type;
                    document.getElementById('ruleName').value = rule.name;
                    document.getElementById('ruleDesc').value = rule.description || '';
                    document.getElementById('rulePoints').value = rule.points;
                    document.getElementById('ruleModal').style.display = 'flex';
                } catch (err) {
                    console.error('编辑规则失败:', err);
                    alert('获取规则失败：' + err.message);
                }
            };

            window.toggleRule = async function(id) {
                console.log('切换规则状态 ID:', id);
                try {
                    const { data: rule, error } = await supabaseClient
                        .from('point_rules')
                        .select('enabled')
                        .eq('id', id)
                        .single();
                    if (error) throw error;
                    const { error: updateError } = await supabaseClient
                        .from('point_rules')
                        .update({ enabled: !rule.enabled })
                        .eq('id', id);
                    if (updateError) throw updateError;
                    loadRules();
                } catch (err) {
                    console.error('切换状态失败:', err);
                    alert('切换失败：' + err.message);
                }
            };

            window.deleteRule = async function(id) {
                console.log('删除规则 ID:', id);
                if (!confirm('确定删除？')) return;
                try {
                    const { error } = await supabaseClient
                        .from('point_rules')
                        .delete()
                        .eq('id', id);
                    if (error) throw error;
                    loadRules();
                } catch (err) {
                    console.error('删除失败:', err);
                    alert('删除失败：' + err.message);
                }
            };

            window.saveRule = async function() {
                const id = document.getElementById('ruleId').value;
                const type = document.getElementById('ruleType').value;
                const name = document.getElementById('ruleName').value.trim();
                const desc = document.getElementById('ruleDesc').value.trim();
                const points = parseInt(document.getElementById('rulePoints').value);
                if (!name || !points) {
                    alert('请填写名称和分值');
                    return;
                }
                const data = { type, name, description: desc, points, enabled: true };
                try {
                    if (id) {
                        const { error } = await supabaseClient
                            .from('point_rules')
                            .update(data)
                            .eq('id', id);
                        if (error) throw error;
                    } else {
                        const { error } = await supabaseClient
                            .from('point_rules')
                            .insert([data]);
                        if (error) throw error;
                    }
                    closeRuleModal();
                    loadRules();
                } catch (err) {
                    console.error('保存规则失败:', err);
                    alert('保存失败：' + err.message);
                }
            };

            window.closeRuleModal = function() {
                document.getElementById('ruleModal').style.display = 'none';
            };

            // ---------- 学生管理 ----------
            async function loadStudents() {
                console.log('加载学生列表');
                try {
                    const { data: students, error } = await supabaseClient
                        .from('students')
                        .select('*')
                        .order('student_id');
                    if (error) throw error;
                    const tbody = document.getElementById('studentsList');
                    tbody.innerHTML = '';
                    students.forEach(s => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="checkbox-col"><input type="checkbox" class="student-checkbox" value="${s.id}"></td>
                            <td>${s.student_id}</td>
                            <td>${s.name}</td>
                            <td>${s.class || '1班'}</td>
                            <td>${s.total_points}</td>
                            <td><button class="btn btn-success btn-sm" data-action="editStudent" data-id="${s.id}" data-name="${s.name}" data-class="${s.class || ''}">编辑</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } catch (err) {
                    console.error('加载学生失败:', err);
                    alert('加载学生失败：' + err.message);
                }
            }

            window.toggleSelectAll = function() {
                const checkboxes = document.querySelectorAll('.student-checkbox');
                const selectAll = document.getElementById('selectAllCheckbox');
                const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                checkboxes.forEach(cb => cb.checked = !allChecked);
                if (selectAll) selectAll.checked = !allChecked;
            };

            window.toggleAllCheckboxes = function() {
                const selectAll = document.getElementById('selectAllCheckbox');
                const checkboxes = document.querySelectorAll('.student-checkbox');
                checkboxes.forEach(cb => cb.checked = selectAll.checked);
            };

            window.clearSelectedPoints = async function() {
                const checkboxes = document.querySelectorAll('.student-checkbox:checked');
                if (checkboxes.length === 0) {
                    alert('请至少选择一个学生');
                    return;
                }
                if (!confirm(`确定要将选中的 ${checkboxes.length} 名学生的积分清零吗？`)) return;

                const studentIds = Array.from(checkboxes).map(cb => cb.value);
                try {
                    for (const id of studentIds) {
                        const { error } = await supabaseClient
                            .from('students')
                            .update({ total_points: 0 })
                            .eq('id', id);
                        if (error) throw error;
                    }
                    alert('积分清零成功');
                    loadStudents();
                    loadRank();
                } catch (err) {
                    console.error('积分清零失败:', err);
                    alert('积分清零失败：' + err.message);
                }
            };

            window.editStudent = function(id, name, className) {
                console.log('编辑学生:', id, name, className);
                document.getElementById('editStudentId').value = id;
                document.getElementById('editStudentName').value = name;
                document.getElementById('editStudentClass').value = className;
                document.getElementById('editStudentPoints').value = 0;
                document.getElementById('studentModal').style.display = 'flex';
            };

            window.closeStudentModal = function() {
                document.getElementById('studentModal').style.display = 'none';
            };

            window.saveStudent = async function() {
                const id = document.getElementById('editStudentId').value;
                const name = document.getElementById('editStudentName').value.trim();
                const className = document.getElementById('editStudentClass').value.trim();
                const pointsAdjust = parseInt(document.getElementById('editStudentPoints').value) || 0;

                if (!name) {
                    alert('姓名不能为空');
                    return;
                }
                try {
                    const { error: updateError } = await supabaseClient
                        .from('students')
                        .update({ name, class: className })
                        .eq('id', id);
                    if (updateError) throw updateError;

                    if (pointsAdjust !== 0) {
                        const { error: rpcError } = await supabaseClient
                            .rpc('increment_student_points', { student_id: id, points: pointsAdjust });
                        if (rpcError) throw rpcError;
                    }

                    closeStudentModal();
                    loadStudents();
                    loadRank();
                } catch (err) {
                    console.error('保存学生失败:', err);
                    alert('保存失败：' + err.message);
                }
            };

            // ---------- 申请审核 ----------
            async function loadApplications() {
                console.log('加载申请列表');
                try {
                    // 待审核
                    const { data: pending, error: pendingError } = await supabaseClient
                        .from('applications')
                        .select('*, students(name, student_id), point_rules(name, points, type)')
                        .eq('status', 'pending')
                        .order('created_at');
                    if (pendingError) throw pendingError;
                    const pendingTbody = document.getElementById('pendingList');
                    pendingTbody.innerHTML = '';
                    if (pending && pending.length > 0) {
                        pending.forEach(app => {
                            const tr = document.createElement('tr');
                            const typeClass = app.point_rules.type === 'add' ? 'type-badge-add' : 'type-badge-subtract';
                            const typeText = app.point_rules.type === 'add' ? '加分' : '扣分';
                            tr.innerHTML = `
                                <td>${app.students.name} (${app.students.student_id})</td>
                                <td>${app.point_rules.name}</td>
                                <td><span class="${typeClass}">${typeText}</span></td>
                                <td>${app.custom_points || app.point_rules.points}</td>
                                <td>${app.reason || ''}</td>
                                <td>${new Date(app.created_at).toLocaleString()}</td>
                                <td>
                                    <button class="btn btn-success btn-sm" data-action="reviewApp" data-id="${app.id}" data-status="approved">通过</button>
                                    <button class="btn btn-danger btn-sm" data-action="reviewApp" data-id="${app.id}" data-status="rejected">拒绝</button>
                                </td>
                            `;
                            pendingTbody.appendChild(tr);
                        });
                    } else {
                        pendingTbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">暂无待审核申请</td></tr>';
                    }

                    // 已审核
                    const { data: history, error: historyError } = await supabaseClient
                        .from('applications')
                        .select('*, students(name, student_id), point_rules(name, points, type)')
                        .neq('status', 'pending')
                        .order('reviewed_at', { ascending: false });
                    if (historyError) throw historyError;
                    const historyTbody = document.getElementById('historyList');
                    historyTbody.innerHTML = '';
                    if (history && history.length > 0) {
                        history.forEach(app => {
                            const tr = document.createElement('tr');
                            const statusClass = `status-${app.status}`;
                            const statusText = app.status === 'approved' ? '已通过' : '已拒绝';
                            const typeClass = app.point_rules?.type === 'add' ? 'type-badge-add' : 'type-badge-subtract';
                            const typeText = app.point_rules?.type === 'add' ? '加分' : '扣分';
                            tr.innerHTML = `
                                <td>${app.students.name} (${app.students.student_id})</td>
                                <td>${app.point_rules?.name || '已删除规则'}</td>
                                <td><span class="${typeClass}">${typeText}</span></td>
                                <td>${app.custom_points || app.point_rules?.points || ''}</td>
                                <td>${app.reason || ''}</td>
                                <td><span class="${statusClass}">${statusText}</span></td>
                                <td>${app.reviewed_at ? new Date(app.reviewed_at).toLocaleString() : ''}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" data-action="deleteHistory" data-id="${app.id}">删除</button>
                                </td>
                            `;
                            historyTbody.appendChild(tr);
                        });
                    } else {
                        historyTbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">暂无已审核记录</td></tr>';
                    }
                } catch (err) {
                    console.error('加载申请失败:', err);
                    alert('加载申请失败：' + err.message);
                }
            }

            window.reviewApplication = async function(id, status) {
                console.log('审核申请:', id, status);
                try {
                    const { error: updateError } = await supabaseClient
                        .from('applications')
                        .update({ status, reviewed_at: new Date() })
                        .eq('id', id);
                    if (updateError) throw updateError;

                    if (status === 'approved') {
                        const { data: app, error: fetchError } = await supabaseClient
                            .from('applications')
                            .select('student_id, custom_points, point_rules(points, type)')
                            .eq('id', id)
                            .single();
                        if (fetchError) throw fetchError;

                        const points = app.custom_points || app.point_rules?.points;
                        if (!points) throw new Error('无法确定分值');

                        // 根据规则类型决定增减方向
                        const pointValue = app.point_rules.type === 'add' ? points : -points;

                        const { error: rpcError } = await supabaseClient
                            .rpc('increment_student_points', {
                                student_id: app.student_id,
                                points: pointValue
                            });
                        if (rpcError) throw rpcError;
                    }

                    loadApplications();
                    loadRank();
                } catch (err) {
                    console.error('审核失败:', err);
                    alert('审核失败：' + err.message);
                }
            };

            window.deleteHistory = async function(id) {
                console.log('删除已审核记录 ID:', id);
                if (!confirm('确定删除此记录吗？此操作不会影响学生积分。')) return;
                try {
                    const { error } = await supabaseClient
                        .from('applications')
                        .delete()
                        .eq('id', id);
                    if (error) throw error;
                    loadApplications();
                } catch (err) {
                    console.error('删除失败:', err);
                    alert('删除失败：' + err.message);
                }
            };

            // ---------- 积分排名 ----------
            async function loadRank() {
                console.log('加载积分排名');
                try {
                    const { data: students, error } = await supabaseClient
                        .from('students')
                        .select('student_id, name, class, total_points')
                        .order('total_points', { ascending: false });
                    if (error) throw error;
                    const tbody = document.getElementById('rankList');
                    tbody.innerHTML = '';
                    students.forEach((s, idx) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${idx+1}</td><td>${s.student_id}</td><td>${s.name}</td><td>${s.class || '1班'}</td><td>${s.total_points}</td>`;
                        tbody.appendChild(tr);
                    });
                } catch (err) {
                    console.error('加载排名失败:', err);
                    alert('加载排名失败：' + err.message);
                }
            }

            // ---------- 静态按钮事件绑定 ----------
            function bindStaticButtons() {
                document.getElementById('addRuleBtn').addEventListener('click', function() {
                    document.getElementById('ruleModalTitle').innerText = '新建规则';
                    document.getElementById('ruleId').value = '';
                    document.getElementById('ruleType').value = 'add';
                    document.getElementById('ruleName').value = '';
                    document.getElementById('ruleDesc').value = '';
                    document.getElementById('rulePoints').value = 5;
                    document.getElementById('ruleModal').style.display = 'flex';
                });

                document.getElementById('saveRuleBtn').addEventListener('click', saveRule);
                document.getElementById('closeRuleModalBtn').addEventListener('click', closeRuleModal);
                document.getElementById('saveStudentBtn').addEventListener('click', saveStudent);
                document.getElementById('closeStudentModalBtn').addEventListener('click', closeStudentModal);

                document.getElementById('studentSearch').addEventListener('input', function(e) {
                    const kw = e.target.value.toLowerCase();
                    document.querySelectorAll('#studentsList tr').forEach(tr => {
                        tr.style.display = tr.innerText.toLowerCase().includes(kw) ? '' : 'none';
                    });
                });

                document.getElementById('historySearch').addEventListener('input', function(e) {
                    const kw = e.target.value.toLowerCase();
                    document.querySelectorAll('#historyList tr').forEach(tr => {
                        tr.style.display = tr.innerText.toLowerCase().includes(kw) ? '' : 'none';
                    });
                });
            }

            // 动态按钮事件委托
            document.addEventListener('click', function(e) {
                const target = e.target.closest('button');
                if (!target) return;

                const action = target.getAttribute('data-action');
                if (action) {
                    e.preventDefault();
                    console.log('事件委托触发:', action, target.dataset);
                    switch (action) {
                        case 'editRule':
                            editRule(target.dataset.id);
                            break;
                        case 'toggleRule':
                            toggleRule(target.dataset.id);
                            break;
                        case 'deleteRule':
                            deleteRule(target.dataset.id);
                            break;
                        case 'editStudent':
                            editStudent(target.dataset.id, target.dataset.name, target.dataset.class);
                            break;
                        case 'reviewApp':
                            reviewApplication(target.dataset.id, target.dataset.status);
                            break;
                        case 'deleteHistory':
                            deleteHistory(target.dataset.id);
                            break;
                        default:
                            console.warn('未知动作:', action);
                    }
                }
            });

            // ---------- 确保登录/登出函数全局可用 ----------
            window.teacherLogin = teacherLogin;
            window.teacherLogout = teacherLogout;

            // ---------- 初始化 ----------
            checkTeacherLogin();
            bindStaticButtons();
        })();
    </script>
