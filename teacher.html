<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师管理后台 · 审核申请 · 管理积分</title>
    <meta name="description" content="教师可管理加分/扣分规则、审核学生申请、查看积分排名，支持批量操作和积分清零。">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* 样式与之前相同，为节省篇幅此处省略，请保留你已有的完整样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        .login-container h2 { margin-bottom: 20px; color: #333; }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-container .error { color: red; margin-top: 10px; }
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            display: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 { color: #333; }
        .nav a {
            color: #667eea;
            text-decoration: none;
            margin-left: 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        th { background: #f1f5f9; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .status-pending { background: #fff3cd; color: #856404; padding: 4px 10px; border-radius: 20px; }
        .status-approved { background: #d4edda; color: #155724; padding: 4px 10px; border-radius: 20px; }
        .status-rejected { background: #f8d7da; color: #721c24; padding: 4px 10px; border-radius: 20px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
        }
        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .search-box {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 250px;
            margin-bottom: 15px;
        }
        .checkbox-col {
            width: 40px;
            text-align: center;
        }
        .type-badge-add {
            background: #d4edda;
            color: #155724;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .type-badge-subtract {
            background: #f8d7da;
            color: #721c24;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="loginContainer" class="login-container">
        <h2>教师登录</h2>
        <input type="text" id="username" placeholder="用户名" value="admin">
        <input type="password" id="password" placeholder="密码">
        <button onclick="teacherLogin()">登录</button>
        <p id="loginError" class="error"></p>
    </div>

    <div id="mainContainer" class="main-container">
        <div class="header">
            <h1>📊 班级管理 · 教师端</h1>
            <div class="nav">
                <a href="#" onclick="teacherLogout()">退出登录</a>
            </div>
        </div>

        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('rules')">📋 规则管理</button>
            <button class="tab-btn" onclick="switchTab('students')">👥 学生管理</button>
            <button class="tab-btn" onclick="switchTab('applications')">📬 申请审核</button>
            <button class="tab-btn" onclick="switchTab('rank')">🏆 积分排名</button>
        </div>

        <!-- 规则管理 -->
        <div id="rulesPanel" class="panel active">
            <div class="card">
                <div class="card-header">
                    <h2>加分/扣分规则管理</h2>
                    <button class="btn btn-primary" id="addRuleBtn">➕ 新建规则</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>类型</th>
                            <th>名称</th>
                            <th>描述</th>
                            <th>分值</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="rulesList">
                        <tr><td colspan="6" style="text-align:center;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 学生管理 -->
        <div id="studentsPanel" class="panel">
            <div class="card">
                <div class="card-header">
                    <h2>学生列表</h2>
                    <div>
                        <button class="btn btn-warning" onclick="toggleSelectAll('student')">全选/取消全选</button>
                        <button class="btn btn-danger" onclick="clearSelectedPoints()">积分清零（选中）</button>
                        <input type="text" id="studentSearch" class="search-box" placeholder="搜索学号或姓名">
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th class="checkbox-col"><input type="checkbox" id="selectAllStudent" onclick="toggleAllCheckboxes('student')"></th>
                            <th>学号</th>
                            <th>姓名</th>
                            <th>班级</th>
                            <th>积分</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="studentsList">
                        <tr><td colspan="6" style="text-align:center;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 申请审核（带批量审核功能） -->
        <div id="applicationsPanel" class="panel">
            <div class="card">
                <div class="card-header">
                    <h2>待审核申请</h2>
                    <div>
                        <button class="btn btn-warning" onclick="toggleSelectAll('pending')">全选/取消全选</button>
                        <button class="btn btn-success" onclick="batchReview('approved')">✅ 批量通过</button>
                        <button class="btn btn-danger" onclick="batchReview('rejected')">❌ 批量拒绝</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th class="checkbox-col"><input type="checkbox" id="selectAllPending" onclick="toggleAllCheckboxes('pending')"></th>
                            <th>学生</th>
                            <th>项目</th>
                            <th>类型</th>
                            <th>分值</th>
                            <th>理由</th>
                            <th>申请时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="pendingList">
                        <tr><td colspan="8" style="text-align:center;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card">
                <div class="card-header">
                    <h2>已审核记录</h2>
                    <input type="text" id="historySearch" class="search-box" placeholder="搜索学生姓名或学号">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>学生</th>
                            <th>项目</th>
                            <th>类型</th>
                            <th>分值</th>
                            <th>理由</th>
                            <th>状态</th>
                            <th>审核时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyList">
                        <tr><td colspan="8" style="text-align:center;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 积分排名 -->
        <div id="rankPanel" class="panel">
            <div class="card">
                <h2>积分排名</h2>
                <table>
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>学号</th>
                            <th>姓名</th>
                            <th>班级</th>
                            <th>积分</th>
                        </tr>
                    </thead>
                    <tbody id="rankList">
                        <tr><td colspan="5" style="text-align:center;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 规则编辑模态框 -->
    <div id="ruleModal" class="modal">
        <div class="modal-content">
            <h3 id="ruleModalTitle">新建规则</h3>
            <input type="hidden" id="ruleId">
            <label>规则类型</label>
            <select id="ruleType">
                <option value="add">➕ 加分规则</option>
                <option value="subtract">➖ 扣分规则</option>
            </select>
            <label>规则名称</label><input type="text" id="ruleName">
            <label>描述</label><textarea id="ruleDesc" rows="2"></textarea>
            <label>分值</label><input type="number" id="rulePoints" value="5" min="1">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn btn-success" id="saveRuleBtn">保存</button>
                <button class="btn btn-danger" id="closeRuleModalBtn">取消</button>
            </div>
        </div>
    </div>

    <!-- 学生编辑模态框 -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h3>编辑学生</h3>
            <input type="hidden" id="editStudentId">
            <label>姓名</label><input type="text" id="editStudentName">
            <label>班级</label><input type="text" id="editStudentClass">
            <label>调整积分</label><input type="number" id="editStudentPoints" value="0" placeholder="正加负减">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn btn-success" id="saveStudentBtn">保存</button>
                <button class="btn btn-danger" id="closeStudentModalBtn">取消</button>
            </div>
        </div>
    </div>

    <script>
        // ========== Supabase 配置（使用 supabaseClient 避免冲突）==========
        const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== 登录/登出 ==========
        async function teacherLogin() {
            console.log('登录函数被调用');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const { data, error } = await supabaseClient
                    .from('config')
                    .select('admin_password')
                    .eq('id', 1)
                    .single();
                
                if (error || !data) {
                    throw error || new Error('无法验证');
                }
                
                if (username === 'admin' && password === data.admin_password) {
                    sessionStorage.setItem('teacherLoggedIn', 'true');
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('mainContainer').style.display = 'block';
                    
                    // 加载所有数据
                    loadRules();
                    loadStudents();
                    loadApplications();
                    loadRank();
                } else {
                    document.getElementById('loginError').innerText = '用户名或密码错误';
                }
            } catch (err) {
                console.error('登录错误:', err);
                document.getElementById('loginError').innerText = '系统错误：' + err.message;
            }
        }

        function teacherLogout() {
            sessionStorage.removeItem('teacherLoggedIn');
            location.reload();
        }

        function checkTeacherLogin() {
            if (sessionStorage.getItem('teacherLoggedIn') === 'true') {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                loadRules();
                loadStudents();
                loadApplications();
                loadRank();
            } else {
                document.getElementById('loginContainer').style.display = 'block';
                document.getElementById('mainContainer').style.display = 'none';
            }
        }

        // ========== 标签页切换 ==========
        function switchTab(tab) {
            console.log('切换标签页:', tab);
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tab + 'Panel').classList.add('active');
            
            // 激活对应的标签按钮
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(`'${tab}'`)) {
                    btn.classList.add('active');
                }
            });
        }

        // ========== 规则管理 ==========
        async function loadRules() {
            console.log('加载规则列表');
            const tbody = document.getElementById('rulesList');
            if (!tbody) return;
            
            try {
                const { data: rules, error } = await supabaseClient
                    .from('point_rules')
                    .select('*')
                    .order('type')
                    .order('id');
                
                if (error) throw error;
                
                tbody.innerHTML = '';
                
                if (!rules || rules.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">暂无规则，请先创建</td></tr>';
                    return;
                }
                
                rules.forEach(rule => {
                    const tr = document.createElement('tr');
                    const typeClass = rule.type === 'add' ? 'type-badge-add' : 'type-badge-subtract';
                    const typeText = rule.type === 'add' ? '加分' : '扣分';
                    tr.innerHTML = `
                        <td><span class="${typeClass}">${typeText}</span></td>
                        <td>${rule.name}</td>
                        <td>${rule.description || '-'}</td>
                        <td>${rule.points}</td>
                        <td><span style="background:${rule.enabled ? '#d4edda' : '#f8d7da'}; color:${rule.enabled ? '#155724' : '#721c24'}; padding:4px 10px; border-radius:20px;">${rule.enabled ? '启用' : '禁用'}</span></td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="editRule(${rule.id})">编辑</button>
                            <button class="btn btn-warning btn-sm" onclick="toggleRule(${rule.id})">${rule.enabled ? '禁用' : '启用'}</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteRule(${rule.id})">删除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('加载规则失败:', err);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">加载失败：${err.message}</td></tr>`;
            }
        }

        async function editRule(id) {
            try {
                const { data: rule, error } = await supabaseClient
                    .from('point_rules')
                    .select('*')
                    .eq('id', id)
                    .single();
                if (error) throw error;
                
                document.getElementById('ruleModalTitle').innerText = '编辑规则';
                document.getElementById('ruleId').value = rule.id;
                document.getElementById('ruleType').value = rule.type;
                document.getElementById('ruleName').value = rule.name;
                document.getElementById('ruleDesc').value = rule.description || '';
                document.getElementById('rulePoints').value = rule.points;
                document.getElementById('ruleModal').style.display = 'flex';
            } catch (err) {
                alert('获取规则失败：' + err.message);
            }
        }

        async function toggleRule(id) {
            try {
                const { data: rule, error } = await supabaseClient
                    .from('point_rules')
                    .select('enabled')
                    .eq('id', id)
                    .single();
                if (error) throw error;
                
                const { error: updateError } = await supabaseClient
                    .from('point_rules')
                    .update({ enabled: !rule.enabled })
                    .eq('id', id);
                if (updateError) throw updateError;
                
                loadRules();
            } catch (err) {
                alert('切换失败：' + err.message);
            }
        }

        async function deleteRule(id) {
            if (!confirm('确定删除？')) return;
            try {
                const { error } = await supabaseClient
                    .from('point_rules')
                    .delete()
                    .eq('id', id);
                if (error) throw error;
                loadRules();
            } catch (err) {
                alert('删除失败：' + err.message);
            }
        }

        async function saveRule() {
            const id = document.getElementById('ruleId').value;
            const type = document.getElementById('ruleType').value;
            const name = document.getElementById('ruleName').value.trim();
            const desc = document.getElementById('ruleDesc').value.trim();
            const points = parseInt(document.getElementById('rulePoints').value);
            
            if (!name || !points) {
                alert('请填写名称和分值');
                return;
            }
            
            const data = { type, name, description: desc, points, enabled: true };
            
            try {
                if (id) {
                    const { error } = await supabaseClient
                        .from('point_rules')
                        .update(data)
                        .eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient
                        .from('point_rules')
                        .insert([data]);
                    if (error) throw error;
                }
                closeRuleModal();
                loadRules();
            } catch (err) {
                alert('保存失败：' + err.message);
            }
        }

        function closeRuleModal() {
            document.getElementById('ruleModal').style.display = 'none';
        }

        // ========== 学生管理 ==========
        async function loadStudents() {
            console.log('加载学生列表');
            const tbody = document.getElementById('studentsList');
            if (!tbody) return;
            
            try {
                const { data: students, error } = await supabaseClient
                    .from('students')
                    .select('*')
                    .order('student_id');
                
                if (error) throw error;
                
                tbody.innerHTML = '';
                
                if (!students || students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">暂无学生数据</td></tr>';
                    return;
                }
                
                students.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="checkbox-col"><input type="checkbox" class="student-checkbox" value="${s.id}"></td>
                        <td>${s.student_id}</td>
                        <td>${s.name}</td>
                        <td>${s.class || '1班'}</td>
                        <td>${s.total_points}</td>
                        <td><button class="btn btn-success btn-sm" onclick="editStudent('${s.id}', '${s.name}', '${s.class || ''}')">编辑</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('加载学生失败:', err);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">加载失败：${err.message}</td></tr>`;
            }
        }

        function toggleSelectAll(type) {
            let checkboxes, selectAll;
            if (type === 'student') {
                checkboxes = document.querySelectorAll('.student-checkbox');
                selectAll = document.getElementById('selectAllStudent');
            } else if (type === 'pending') {
                checkboxes = document.querySelectorAll('.pending-checkbox');
                selectAll = document.getElementById('selectAllPending');
            } else {
                return;
            }
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            if (selectAll) selectAll.checked = !allChecked;
        }

        function toggleAllCheckboxes(type) {
            let checkboxes, selectAll;
            if (type === 'student') {
                checkboxes = document.querySelectorAll('.student-checkbox');
                selectAll = document.getElementById('selectAllStudent');
            } else if (type === 'pending') {
                checkboxes = document.querySelectorAll('.pending-checkbox');
                selectAll = document.getElementById('selectAllPending');
            } else {
                return;
            }
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
        }

        async function clearSelectedPoints() {
            const checkboxes = document.querySelectorAll('.student-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('请至少选择一个学生');
                return;
            }
            if (!confirm(`确定要将选中的 ${checkboxes.length} 名学生的积分清零吗？`)) return;

            const studentIds = Array.from(checkboxes).map(cb => cb.value);
            let successCount = 0;
            
            for (const id of studentIds) {
                try {
                    const { error } = await supabaseClient
                        .from('students')
                        .update({ total_points: 0 })
                        .eq('id', id);
                    if (error) throw error;
                    successCount++;
                } catch (err) {
                    console.error('清零失败:', err);
                }
            }
            
            alert(`积分清零完成：${successCount} 个成功`);
            loadStudents();
            loadRank();
        }

        function editStudent(id, name, className) {
            document.getElementById('editStudentId').value = id;
            document.getElementById('editStudentName').value = name;
            document.getElementById('editStudentClass').value = className;
            document.getElementById('editStudentPoints').value = 0;
            document.getElementById('studentModal').style.display = 'flex';
        }

        function closeStudentModal() {
            document.getElementById('studentModal').style.display = 'none';
        }

        async function saveStudent() {
            const id = document.getElementById('editStudentId').value;
            const name = document.getElementById('editStudentName').value.trim();
            const className = document.getElementById('editStudentClass').value.trim();
            const pointsAdjust = parseInt(document.getElementById('editStudentPoints').value) || 0;

            if (!name) {
                alert('姓名不能为空');
                return;
            }
            
            try {
                const { error: updateError } = await supabaseClient
                    .from('students')
                    .update({ name, class: className })
                    .eq('id', id);
                if (updateError) throw updateError;

                if (pointsAdjust !== 0) {
                    const { error: rpcError } = await supabaseClient
                        .rpc('increment_student_points', { student_id: id, points: pointsAdjust });
                    if (rpcError) throw rpcError;
                }

                closeStudentModal();
                loadStudents();
                loadRank();
            } catch (err) {
                alert('保存失败：' + err.message);
            }
        }

        // ========== 申请审核 ==========
        async function loadApplications() {
            console.log('加载申请列表');
            const pendingTbody = document.getElementById('pendingList');
            const historyTbody = document.getElementById('historyList');
            
            try {
                // 待审核
                const { data: pending, error: pendingError } = await supabaseClient
                    .from('applications')
                    .select('*, students(name, student_id), point_rules(name, points, type)')
                    .eq('status', 'pending')
                    .order('created_at');
                
                if (pendingError) throw pendingError;
                
                if (pendingTbody) {
                    pendingTbody.innerHTML = '';
                    
                    if (pending && pending.length > 0) {
                        pending.forEach(app => {
                            const tr = document.createElement('tr');
                            const typeClass = app.point_rules?.type === 'add' ? 'type-badge-add' : 'type-badge-subtract';
                            const typeText = app.point_rules?.type === 'add' ? '加分' : '扣分';
                            tr.innerHTML = `
                                <td class="checkbox-col"><input type="checkbox" class="pending-checkbox" value="${app.id}"></td>
                                <td>${app.students?.name || '未知'} (${app.students?.student_id || ''})</td>
                                <td>${app.point_rules?.name || '已删除规则'}</td>
                                <td><span class="${typeClass}">${typeText}</span></td>
                                <td>${app.custom_points || app.point_rules?.points || ''}</td>
                                <td>${app.reason || ''}</td>
                                <td>${new Date(app.created_at).toLocaleString()}</td>
                                <td>
                                    <button class="btn btn-success btn-sm" onclick="reviewApplication(${app.id}, 'approved')">通过</button>
                                    <button class="btn btn-danger btn-sm" onclick="reviewApplication(${app.id}, 'rejected')">拒绝</button>
                                </td>
                            `;
                            pendingTbody.appendChild(tr);
                        });
                    } else {
                        pendingTbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">暂无待审核申请</td></tr>';
                    }
                }

                // 已审核
                const { data: history, error: historyError } = await supabaseClient
                    .from('applications')
                    .select('*, students(name, student_id), point_rules(name, points, type)')
                    .neq('status', 'pending')
                    .order('reviewed_at', { ascending: false });
                
                if (historyError) throw historyError;
                
                if (historyTbody) {
                    historyTbody.innerHTML = '';
                    
                    if (history && history.length > 0) {
                        history.forEach(app => {
                            const tr = document.createElement('tr');
                            const statusClass = `status-${app.status}`;
                            const statusText = app.status === 'approved' ? '已通过' : '已拒绝';
                            const typeClass = app.point_rules?.type === 'add' ? 'type-badge-add' : 'type-badge-subtract';
                            const typeText = app.point_rules?.type === 'add' ? '加分' : '扣分';
                            tr.innerHTML = `
                                <td>${app.students?.name || '未知'} (${app.students?.student_id || ''})</td>
                                <td>${app.point_rules?.name || '已删除规则'}</td>
                                <td><span class="${typeClass}">${typeText}</span></td>
                                <td>${app.custom_points || app.point_rules?.points || ''}</td>
                                <td>${app.reason || ''}</td>
                                <td><span class="${statusClass}">${statusText}</span></td>
                                <td>${app.reviewed_at ? new Date(app.reviewed_at).toLocaleString() : ''}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="deleteHistory(${app.id})">删除</button>
                                </td>
                            `;
                            historyTbody.appendChild(tr);
                        });
                    } else {
                        historyTbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">暂无已审核记录</td></tr>';
                    }
                }
            } catch (err) {
                console.error('加载申请失败:', err);
                if (pendingTbody) pendingTbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:red;">加载失败：${err.message}</td></tr>`;
                if (historyTbody) historyTbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:red;">加载失败：${err.message}</td></tr>`;
            }
        }

        // 批量审核
        async function batchReview(status) {
            const checkboxes = document.querySelectorAll('.pending-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('请至少选择一个申请');
                return;
            }

            const statusText = status === 'approved' ? '通过' : '拒绝';
            if (!confirm(`确定要批量${statusText}选中的 ${checkboxes.length} 个申请吗？`)) return;

            const ids = Array.from(checkboxes).map(cb => cb.value);
            let successCount = 0;
            let failCount = 0;

            for (const id of ids) {
                try {
                    // 更新申请状态
                    const { error: updateError } = await supabaseClient
                        .from('applications')
                        .update({ status, reviewed_at: new Date() })
                        .eq('id', id);
                    if (updateError) throw updateError;

                    // 如果是通过，调整积分
                    if (status === 'approved') {
                        // 获取申请详情（明确选择需要的字段，避免歧义）
                        const { data: app, error: fetchError } = await supabaseClient
                            .from('applications')
                            .select(`
                                student_id,
                                custom_points,
                                point_rules (
                                    points,
                                    type
                                )
                            `)
                            .eq('id', id)
                            .single();
                        
                        if (fetchError) throw fetchError;
                        if (!app) throw new Error('未找到申请记录');

                        const points = app.custom_points || app.point_rules?.points;
                        if (!points) throw new Error('无法确定分值');

                        const pointValue = app.point_rules.type === 'add' ? points : -points;

                        const { error: rpcError } = await supabaseClient
                            .rpc('increment_student_points', {
                                student_id: app.student_id,
                                points: pointValue
                            });
                        if (rpcError) throw rpcError;
                    }
                    successCount++;
                } catch (err) {
                    failCount++;
                    console.error('批量处理失败:', id, err);
                }
            }

            alert(`批量处理完成：${successCount} 个成功${failCount > 0 ? '，' + failCount + ' 个失败' : ''}`);
            loadApplications();
            loadRank();
            
            const selectAll = document.getElementById('selectAllPending');
            if (selectAll) selectAll.checked = false;
        }

        // 单个审核
        async function reviewApplication(id, status) {
            console.log('单个审核:', id, status);
            try {
                // 更新申请状态
                const { error: updateError } = await supabaseClient
                    .from('applications')
                    .update({ status, reviewed_at: new Date() })
                    .eq('id', id);
                if (updateError) throw updateError;

                // 如果是通过，调整积分
                if (status === 'approved') {
                    // 获取申请详情（明确选择需要的字段，避免歧义）
                    const { data: app, error: fetchError } = await supabaseClient
                        .from('applications')
                        .select(`
                            student_id,
                            custom_points,
                            point_rules (
                                points,
                                type
                            )
                        `)
                        .eq('id', id)
                        .single();
                    
                    if (fetchError) throw fetchError;
                    if (!app) throw new Error('未找到申请记录');

                    const points = app.custom_points || app.point_rules?.points;
                    if (!points) throw new Error('无法确定分值');

                    const pointValue = app.point_rules.type === 'add' ? points : -points;

                    const { error: rpcError } = await supabaseClient
                        .rpc('increment_student_points', {
                            student_id: app.student_id,
                            points: pointValue
                        });
                    if (rpcError) throw rpcError;
                }

                loadApplications();
                loadRank();
            } catch (err) {
                console.error('审核失败:', err);
                alert('审核失败：' + err.message);
            }
        }

        // 删除历史记录
        async function deleteHistory(id) {
            if (!confirm('确定删除此记录吗？此操作不会影响学生积分。')) return;
            try {
                const { error } = await supabaseClient
                    .from('applications')
                    .delete()
                    .eq('id', id);
                if (error) throw error;
                loadApplications();
            } catch (err) {
                alert('删除失败：' + err.message);
            }
        }

        // ========== 积分排名 ==========
        async function loadRank() {
            console.log('加载积分排名');
            const tbody = document.getElementById('rankList');
            if (!tbody) return;
            
            try {
                const { data: students, error } = await supabaseClient
                    .from('students')
                    .select('student_id, name, class, total_points')
                    .order('total_points', { ascending: false });
                
                if (error) throw error;
                
                tbody.innerHTML = '';
                
                students.forEach((s, idx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${idx+1}</td><td>${s.student_id}</td><td>${s.name}</td><td>${s.class || '1班'}</td><td>${s.total_points}</td>`;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('加载排名失败:', err);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:red;">加载失败：${err.message}</td></tr>`;
            }
        }

        // ========== 静态按钮事件绑定 ==========
        function initEventListeners() {
            const addRuleBtn = document.getElementById('addRuleBtn');
            if (addRuleBtn) {
                addRuleBtn.addEventListener('click', function() {
                    document.getElementById('ruleModalTitle').innerText = '新建规则';
                    document.getElementById('ruleId').value = '';
                    document.getElementById('ruleType').value = 'add';
                    document.getElementById('ruleName').value = '';
                    document.getElementById('ruleDesc').value = '';
                    document.getElementById('rulePoints').value = 5;
                    document.getElementById('ruleModal').style.display = 'flex';
                });
            }

            document.getElementById('saveRuleBtn')?.addEventListener('click', saveRule);
            document.getElementById('closeRuleModalBtn')?.addEventListener('click', closeRuleModal);
            document.getElementById('saveStudentBtn')?.addEventListener('click', saveStudent);
            document.getElementById('closeStudentModalBtn')?.addEventListener('click', closeStudentModal);

            const studentSearch = document.getElementById('studentSearch');
            if (studentSearch) {
                studentSearch.addEventListener('input', function(e) {
                    const kw = e.target.value.toLowerCase();
                    document.querySelectorAll('#studentsList tr').forEach(tr => {
                        tr.style.display = tr.innerText.toLowerCase().includes(kw) ? '' : 'none';
                    });
                });
            }

            const historySearch = document.getElementById('historySearch');
            if (historySearch) {
                historySearch.addEventListener('input', function(e) {
                    const kw = e.target.value.toLowerCase();
                    document.querySelectorAll('#historyList tr').forEach(tr => {
                        tr.style.display = tr.innerText.toLowerCase().includes(kw) ? '' : 'none';
                    });
                });
            }
        }

        // ========== 初始化 ==========
        checkTeacherLogin();
        initEventListeners();
    </script>
</body>
</html>
