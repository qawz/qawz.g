<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            position: relative;
            z-index: 1;
            transition: background 0.3s, backdrop-filter 0.3s;
        }
        .container.blur {
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #333;
        }
        .admin-link {
            text-align: right;
            margin-bottom: 20px;
        }
        .admin-link a {
            color: #999;
            text-decoration: none;
            font-size: 0.9em;
        }
        .board {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        /* 液态玻璃卡片样式（所有板块统一使用） */
        .glass-card {
            flex: 0 1 300px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .glass-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 12px 28px rgba(0,0,0,0.15);
        }
        .glass-card h3 {
            margin-top: 0;
            color: #3b82f6;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .glass-card p {
            color: #475569;
            margin: 12px 0;
            line-height: 1.5;
        }
        .glass-btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            margin-top: 12px;
            transition: background 0.2s;
        }
        .glass-btn:hover {
            background: #2563eb;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #aaa;
        }
        #bg-video, #bg-iframe {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
            border: none;
            pointer-events: none;
        }
        #bg-iframe {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="admin-link">
            <a href="admin.html">⚙️ 管理后台</a>
        </div>
        <h1>qawz 的小站</h1>
        <div class="board" id="board"></div>
        <footer>Hosted on GitHub Pages · 2026</footer>
    </div>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadConfig() {
            const { data, error } = await supabaseClient
                .from('config')
                .select('*')
                .eq('id', 1)
                .single();
            if (error) {
                console.error('读取配置失败', error);
                return null;
            }
            return data;
        }

        function renderBoard(config) {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';

            // 收集所有板块（1-8）
            const boards = [];
            for (let i = 1; i <= 8; i++) {
                const hidden = config[`board${i}_hidden`];
                if (hidden) continue; // 隐藏的板块不渲染
                boards.push({
                    title: config[`board${i}_title`] || '',
                    description: config[`board${i}_description`] || '',
                    buttonText: config[`board${i}_button_text`] || '访问',
                    buttonLink: config[`board${i}_button_link`] || '#',
                    order: config[`board${i}_order`] || 0,
                });
            }
            // 按 order 排序
            boards.sort((a, b) => a.order - b.order);

            // 统一使用液态玻璃卡片渲染
            boards.forEach(board => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `
                    <h3>${board.title}</h3>
                    <p>${board.description}</p>
                    ${board.buttonLink && board.buttonLink !== '#' ? `<a href="${board.buttonLink}" class="glass-btn" target="_blank">${board.buttonText}</a>` : ''}
                `;
                boardDiv.appendChild(card);
            });
        }

        function setBackground(config) {
            // 清除已有背景
            const oldVideo = document.getElementById('bg-video');
            if (oldVideo) oldVideo.remove();
            const oldIframe = document.getElementById('bg-iframe');
            if (oldIframe) oldIframe.remove();
            document.body.style.backgroundImage = 'none';

            const videoUrl = config.background_video_url;
            const imageUrl = config.background_image;

            if (videoUrl) {
                if (videoUrl.includes('bilibili.com') || videoUrl.includes('bilibili')) {
                    const iframe = document.createElement('iframe');
                    iframe.id = 'bg-iframe';
                    let src = videoUrl;
                    if (!src.startsWith('http')) {
                        src = `//player.bilibili.com/player.html?bvid=${src}&autoplay=1&loop=1&muted=1&controls=0&disablekb=1&playsinline=1&high_quality=1`;
                    } else {
                        if (!src.includes('autoplay')) src += (src.includes('?') ? '&' : '?') + 'autoplay=1';
                        if (!src.includes('muted')) src += '&muted=1';
                        if (!src.includes('loop')) src += '&loop=1';
                    }
                    iframe.src = src;
                    iframe.allow = 'autoplay; fullscreen';
                    iframe.setAttribute('allowfullscreen', 'true');
                    document.body.appendChild(iframe);
                } else {
                    const video = document.createElement('video');
                    video.id = 'bg-video';
                    video.autoplay = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;
                    const source = document.createElement('source');
                    source.src = videoUrl;
                    source.type = 'video/mp4';
                    video.appendChild(source);
                    video.onerror = () => video.remove();
                    document.body.appendChild(video);
                }
            } else if (imageUrl) {
                document.body.style.backgroundImage = `url('${imageUrl}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundRepeat = 'no-repeat';
                document.body.style.backgroundAttachment = 'fixed';
            }
        }

        (async function() {
            const config = await loadConfig();
            if (config) {
                // 主区域透明度与模糊
                const container = document.getElementById('mainContainer');
                const containerOpacity = (config.container_opacity !== null ? config.container_opacity : 100) / 100;
                container.style.background = `rgba(255, 255, 255, ${containerOpacity})`;
                if (config.container_blur) {
                    container.classList.add('blur');
                } else {
                    container.classList.remove('blur');
                }

                renderBoard(config);
                setBackground(config);
            } else {
                document.getElementById('board').innerHTML = '<p style="color:red;">配置加载失败，请稍后重试。</p>';
            }
        })();
    </script>
</body>
</html>
