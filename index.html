<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my website</title>
    <!-- 引入 Supabase 客户端库 -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; }
        h1 { color: #333; }
        .admin-link { text-align: right; margin-bottom: 20px; }
        .admin-link a { color: #999; text-decoration: none; font-size: 0.9em; }
        .board { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1 1 300px; background: #fff; border: 1px solid #eee; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card h2 { margin-top: 0; color: #667eea; }
        .card p { color: #555; }
        .btn { display: inline-block; background: #667eea; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; margin-top: 10px; }
        .btn:hover { background: #764ba2; }
        footer { margin-top: 40px; text-align: center; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-link">
            <a href="admin.html">⚙️ 管理后台</a>
        </div>
        <h1>qawz 的小站</h1>
        <div class="board" id="board"></div>
        <footer>Hosted on GitHub Pages · 2026</footer>
    </div>

    <script>
        // ===== 你的 Supabase 配置 =====
        const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
        // ==============================

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadConfig() {
            const { data, error } = await supabase
                .from('config')
                .select('*')
                .eq('id', 1)
                .single();
            if (error) {
                console.error('读取配置失败', error);
                return null;
            }
            return data;
        }

        function renderBoard(config) {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';

            // 板块1 - 注意：字段名请按实际修改
            const card1 = document.createElement('div');
            card1.className = 'card';
            card1.innerHTML = `
                <h2>${config.board1_title}</h2>
                <p>${config.board1_description}</p>
                ${config.board1_button_link ? `<a href="${config.board1_button_link}" class="btn" target="_blank">${config.board1_button_text}</a>` : ''}
            `;
            boardDiv.appendChild(card1);

            // 板块2
            const card2 = document.createElement('div');
            card2.className = 'card';
            card2.innerHTML = `
                <h2>${config.board2_title}</h2>
                <p>${config.board2_description}</p>
                ${config.board2_button_link ? `<a href="${config.board2_button_link}" class="btn" target="_blank">${config.board2_button_text}</a>` : ''}
            `;
            boardDiv.appendChild(card2);
        }

        (async function() {
            const config = await loadConfig();
            if (config) {
                renderBoard(config);
            } else {
                document.getElementById('board').innerHTML = '<p style="color:red;">配置加载失败，请稍后重试。</p>';
            }
        })();
    </script>
</body>
</html>
