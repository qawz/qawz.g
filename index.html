<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qawz 的小站</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }
        h1 { color: #333; }
        .admin-link { text-align: right; margin-bottom: 20px; }
        .admin-link a { color: #999; text-decoration: none; font-size: 0.9em; }
        .board {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            flex: 0 1 300px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: opacity 0.3s;
        }
        .card h2 { margin-top: 0; color: #667eea; }
        .card p { color: #555; }
        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
        }
        .btn:hover { background: #764ba2; }
        footer { margin-top: 40px; text-align: center; color: #aaa; }

        #bg-video, #bg-iframe {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
            border: none;
            pointer-events: none;
        }
        #bg-iframe {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-link">
            <a href="admin.html">⚙️ 管理后台</a>
        </div>
        <h1>qawz 的小站</h1>
        <div class="board" id="board"></div>
        <footer>Hosted on GitHub Pages · 2026</footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadConfig() {
            const { data, error } = await supabaseClient
                .from('config')
                .select('*')
                .eq('id', 1)
                .single();
            if (error) {
                console.error('读取配置失败', error);
                return null;
            }
            return data;
        }

        function renderBoard(config) {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';

            // 获取透明度值（0-100），转换为0-1
            const opacity = (config.card_opacity !== null ? config.card_opacity : 100) / 100;

            function createCard(title, desc, btnText, btnLink) {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.opacity = opacity;  // 应用透明度
                card.innerHTML = `
                    <h2>${title || ''}</h2>
                    <p>${desc || ''}</p>
                    ${btnLink ? `<a href="${btnLink}" class="btn" target="_blank">${btnText || '访问'}</a>` : ''}
                `;
                return card;
            }

            // 板块1
            if (!config.board1_hidden) {
                boardDiv.appendChild(createCard(
                    config.board1_title,
                    config.board1_description,
                    config.board1_button_text,
                    config.board1_button_link
                ));
            }
            // 板块2
            if (!config.board2_hidden) {
                boardDiv.appendChild(createCard(
                    config.board2_title,
                    config.board2_description,
                    config.board2_button_text,
                    config.board2_button_link
                ));
            }
            // 板块3
            if (!config.board3_hidden) {
                boardDiv.appendChild(createCard(
                    config.board3_title,
                    config.board3_description,
                    config.board3_button_text,
                    config.board3_button_link
                ));
            }
            // 板块4
            if (!config.board4_hidden) {
                boardDiv.appendChild(createCard(
                    config.board4_title,
                    config.board4_description,
                    config.board4_button_text,
                    config.board4_button_link
                ));
            }
            // 板块5
            if (!config.board5_hidden) {
                boardDiv.appendChild(createCard(
                    config.board5_title,
                    config.board5_description,
                    config.board5_button_text,
                    config.board5_button_link
                ));
            }
        }

        function setBackgroundVideo(videoUrl) {
            const oldVideo = document.getElementById('bg-video');
            if (oldVideo) oldVideo.remove();
            const oldIframe = document.getElementById('bg-iframe');
            if (oldIframe) oldIframe.remove();

            if (!videoUrl) return;

            if (videoUrl.includes('bilibili.com') || videoUrl.includes('bilibili')) {
                const iframe = document.createElement('iframe');
                iframe.id = 'bg-iframe';
                let src = videoUrl;
                if (!src.startsWith('http')) {
                    src = `//player.bilibili.com/player.html?bvid=${src}&autoplay=1&loop=1&muted=1&controls=0&disablekb=1&playsinline=1&high_quality=1`;
                } else {
                    if (!src.includes('autoplay')) src += (src.includes('?') ? '&' : '?') + 'autoplay=1';
                    if (!src.includes('muted')) src += '&muted=1';
                    if (!src.includes('loop')) src += '&loop=1';
                }
                iframe.src = src;
                iframe.allow = 'autoplay; fullscreen';
                iframe.setAttribute('allowfullscreen', 'true');
                document.body.appendChild(iframe);
            } else {
                const video = document.createElement('video');
                video.id = 'bg-video';
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                const source = document.createElement('source');
                source.src = videoUrl;
                source.type = 'video/mp4';
                video.appendChild(source);
                video.onerror = () => video.remove();
                document.body.appendChild(video);
            }
        }

        (async function() {
            const config = await loadConfig();
            if (config) {
                renderBoard(config);
                setBackgroundVideo(config.background_video_url);
            } else {
                document.getElementById('board').innerHTML = '<p style="color:red;">配置加载失败，请稍后重试。</p>';
            }
        })();
    </script>
</body>
</html>
