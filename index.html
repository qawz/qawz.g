<script>
    const SUPABASE_URL = '...';
    const SUPABASE_ANON_KEY = '...';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allCards = [];
    let currentPage = 1;
    let cardsPerPage = 4;
    let globalConfig = {};

    async function loadData() {
        // 加载全局配置
        const { data: config, error: configErr } = await supabase
            .from('config')
            .select('*')
            .eq('id', 1)
            .single();
        if (configErr) console.error('配置加载失败', configErr);
        else globalConfig = config;

        // 加载板块（只取未隐藏的，按顺序排序）
        const { data: blocks, error: blocksErr } = await supabase
            .from('blocks')
            .select('*')
            .eq('hidden', false)
            .order('sort_order', { ascending: true });
        if (blocksErr) console.error('板块加载失败', blocksErr);
        else allCards = blocks.map(b => ({
            title: b.title,
            description: b.description,
            buttonText: b.button_text,
            buttonLink: b.button_link
        }));

        cardsPerPage = globalConfig.cards_per_page || 4;
        renderBoard();
        setBackground(globalConfig);
    }

    // renderBoard 与之前相同，直接使用 allCards 分页
    // setBackground 同前
</script>
