<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qawz 的小站</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            position: relative;
            z-index: 1;
            transition: background 0.3s, backdrop-filter 0.3s;
        }
        .container.blur {
            backdrop-filter: blur(10px);
        }
        h1 { color: #333; }
        .admin-link { text-align: right; margin-bottom: 20px; }
        .admin-link a { color: #999; text-decoration: none; font-size: 0.9em; }
        .board {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            flex: 0 1 300px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: opacity 0.3s;
        }
        .card h2 { margin-top: 0; color: #667eea; }
        .card p { color: #555; }
        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
        }
        .btn:hover { background: #764ba2; }
        footer { margin-top: 40px; text-align: center; color: #aaa; }

        /* 分页控件 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
        }
        .pagination button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .pagination button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .pagination span {
            font-size: 16px;
            color: #333;
        }

        #bg-video, #bg-iframe {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
            border: none;
            pointer-events: none;
        }
        #bg-iframe {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="admin-link">
            <a href="admin.html">⚙️ 管理后台</a>
        </div>
        <h1>qawz 的小站</h1>
        <div class="board" id="board"></div>
        <div class="pagination" id="pagination">
            <button id="prevPage" onclick="changePage(-1)">上一页</button>
            <span id="pageInfo">第 1 页 / 共 1 页</span>
            <button id="nextPage" onclick="changePage(1)">下一页</button>
        </div>
        <footer>Hosted on GitHub Pages · 2026</footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 全局变量
        let allCards = [];          // 所有未隐藏卡片的数组，包含数据
        let currentPage = 1;
        let cardsPerPage = 4;       // 默认，会从数据库加载

        async function loadConfig() {
            const { data, error } = await supabaseClient
                .from('config')
                .select('*')
                .eq('id', 1)
                .single();
            if (error) {
                console.error('读取配置失败', error);
                return null;
            }
            return data;
        }

        // 构建卡片数组（只包含未隐藏的板块）
        function buildCardsArray(config) {
            const cards = [];
            // 板块1
            if (!config.board1_hidden) {
                cards.push({
                    title: config.board1_title,
                    description: config.board1_description,
                    buttonText: config.board1_button_text,
                    buttonLink: config.board1_button_link,
                    order: config.board1_order || 0
                });
            }
            // 板块2
            if (!config.board2_hidden) {
                cards.push({
                    title: config.board2_title,
                    description: config.board2_description,
                    buttonText: config.board2_button_text,
                    buttonLink: config.board2_button_link,
                    order: config.board2_order || 0
                });
            }
            // 板块3
            if (!config.board3_hidden) {
                cards.push({
                    title: config.board3_title,
                    description: config.board3_description,
                    buttonText: config.board3_button_text,
                    buttonLink: config.board3_button_link,
                    order: config.board3_order || 0
                });
            }
            // 板块4
            if (!config.board4_hidden) {
                cards.push({
                    title: config.board4_title,
                    description: config.board4_description,
                    buttonText: config.board4_button_text,
                    buttonLink: config.board4_button_link,
                    order: config.board4_order || 0
                });
            }
            // 板块5
            if (!config.board5_hidden) {
                cards.push({
                    title: config.board5_title,
                    description: config.board5_description,
                    buttonText: config.board5_button_text,
                    buttonLink: config.board5_button_link,
                    order: config.board5_order || 0
                });
            }
            // 按 order 升序排序
            cards.sort((a, b) => a.order - b.order);
            return cards;
        }

        // 渲染当前页的卡片
        function renderBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';

            const start = (currentPage - 1) * cardsPerPage;
            const end = start + cardsPerPage;
            const pageCards = allCards.slice(start, end);

            const cardOpacity = window.globalConfig ? (window.globalConfig.card_opacity || 100) / 100 : 1;

            pageCards.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.style.opacity = cardOpacity;
                cardDiv.innerHTML = `
                    <h2>${card.title || ''}</h2>
                    <p>${card.description || ''}</p>
                    ${card.buttonLink ? `<a href="${card.buttonLink}" class="btn" target="_blank">${card.buttonText || '访问'}</a>` : ''}
                `;
                boardDiv.appendChild(cardDiv);
            });

            // 更新分页信息
            const totalPages = Math.ceil(allCards.length / cardsPerPage);
            document.getElementById('pageInfo').innerText = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        // 翻页函数（全局）
        window.changePage = function(delta) {
            const totalPages = Math.ceil(allCards.length / cardsPerPage);
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderBoard();
            }
        };

        function setBackgroundVideo(videoUrl) {
            const oldVideo = document.getElementById('bg-video');
            if (oldVideo) oldVideo.remove();
            const oldIframe = document.getElementById('bg-iframe');
            if (oldIframe) oldIframe.remove();

            if (!videoUrl) return;

            if (videoUrl.includes('bilibili.com') || videoUrl.includes('bilibili')) {
                const iframe = document.createElement('iframe');
                iframe.id = 'bg-iframe';
                let src = videoUrl;
                if (!src.startsWith('http')) {
                    src = `//player.bilibili.com/player.html?bvid=${src}&autoplay=1&loop=1&muted=1&controls=0&disablekb=1&playsinline=1&high_quality=1`;
                } else {
                    if (!src.includes('autoplay')) src += (src.includes('?') ? '&' : '?') + 'autoplay=1';
                    if (!src.includes('muted')) src += '&muted=1';
                    if (!src.includes('loop')) src += '&loop=1';
                }
                iframe.src = src;
                iframe.allow = 'autoplay; fullscreen';
                iframe.setAttribute('allowfullscreen', 'true');
                document.body.appendChild(iframe);
            } else {
                const video = document.createElement('video');
                video.id = 'bg-video';
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                const source = document.createElement('source');
                source.src = videoUrl;
                source.type = 'video/mp4';
                video.appendChild(source);
                video.onerror = () => video.remove();
                document.body.appendChild(video);
            }
        }

        (async function() {
            const config = await loadConfig();
            if (config) {
                window.globalConfig = config; // 存储以供其他函数使用

                // 设置主区域样式
                const container = document.getElementById('mainContainer');
                const containerOpacity = (config.container_opacity !== null ? config.container_opacity : 100) / 100;
                container.style.background = `rgba(255, 255, 255, ${containerOpacity})`;
                if (config.container_blur) {
                    container.classList.add('blur');
                } else {
                    container.classList.remove('blur');
                }

                // 设置卡片分页
                cardsPerPage = config.cards_per_page || 4;
                allCards = buildCardsArray(config);
                renderBoard();

                // 背景视频
                setBackgroundVideo(config.background_video_url);
            } else {
                document.getElementById('board').innerHTML = '<p style="color:red;">配置加载失败，请稍后重试。</p>';
            }
        })();
    </script>
</body>
</html>
