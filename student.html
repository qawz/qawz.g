<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生端 · 积分系统</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-container button:hover {
            background: #5a67d8;
        }
        .login-container .error {
            color: red;
            margin-top: 10px;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            display: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 { color: #333; }
        .nav a {
            color: #667eea;
            text-decoration: none;
            margin-left: 20px;
        }
        .student-info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e9ecef;
        }
        .points-badge {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
        }
        .rules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .rule-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.2s;
        }
        .rule-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .rule-card h3 { color: #667eea; margin-bottom: 10px; }
        .rule-card p { color: #555; margin-bottom: 15px; }
        .rule-card .points-tag {
            background: #e2e8f0;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .rule-card button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px;
            text-align: left;
        }
        th { background: #f8fafc; }
        .status-pending { background: #fff3cd; color: #856404; padding: 4px 10px; border-radius: 20px; }
        .status-approved { background: #d4edda; color: #155724; padding: 4px 10px; border-radius: 20px; }
        .status-rejected { background: #f8d7da; color: #721c24; padding: 4px 10px; border-radius: 20px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
        }
        .modal-content select,
        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div id="loginContainer" class="login-container">
        <h2>学生登录</h2>
        <input type="number" id="studentIdInput" placeholder="请输入学号 (1-45)" min="1" max="45">
        <button onclick="login()">进入系统</button>
        <p id="loginError" class="error"></p>
    </div>

    <!-- 主界面 -->
    <div id="mainContainer" class="main-container">
        <div class="header">
            <h1>🎓 学生积分系统</h1>
            <div class="nav">
                <a href="#" onclick="logout()">退出登录</a>
            </div>
        </div>

        <div id="studentInfo" class="student-info"></div>

        <h2>📋 可申请加分项目</h2>
        <div id="rulesList" class="rules-grid"></div>

        <h2>📝 我的申请记录</h2>
        <table>
            <thead>
                <tr><th>项目</th><th>分值</th><th>理由</th><th>状态</th><th>申请时间</th><th>审核</th></tr>
            </thead>
            <tbody id="applicationsList"></tbody>
        </table>
    </div>

    <!-- 申请模态框 -->
    <div id="applyModal" class="modal">
        <div class="modal-content">
            <h3>提交加分申请</h3>
            <select id="ruleSelect"></select>
            <input type="number" id="customPoints" placeholder="自定义分值（留空则使用默认）">
            <textarea id="applyReason" rows="3" placeholder="申请理由"></textarea>
            <div class="modal-buttons">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn" style="background:#667eea; color:white;" onclick="submitApplication()">提交</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStudent = null; // 存储学生对象

        // 登录
        window.login = async function() {
            const studentId = document.getElementById('studentIdInput').value.trim();
            if (!studentId) {
                document.getElementById('loginError').innerText = '请输入学号';
                return;
            }
            // 查询学生
            const { data, error } = await supabase
                .from('students')
                .select('*')
                .eq('student_id', parseInt(studentId))
                .maybeSingle();

            if (error || !data) {
                document.getElementById('loginError').innerText = '学号不存在，请确认';
                return;
            }
            currentStudent = data;
            // 保存登录状态
            sessionStorage.setItem('studentId', studentId);
            // 显示主界面
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            // 加载数据
            renderStudentInfo();
            loadRules();
            loadApplications();
        };

        // 检查是否已登录
        async function checkLogin() {
            const savedId = sessionStorage.getItem('studentId');
            if (savedId) {
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .eq('student_id', parseInt(savedId))
                    .maybeSingle();
                if (data) {
                    currentStudent = data;
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('mainContainer').style.display = 'block';
                    renderStudentInfo();
                    loadRules();
                    loadApplications();
                    return;
                }
            }
            // 未登录，显示登录框
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('mainContainer').style.display = 'none';
        }

        function renderStudentInfo() {
            document.getElementById('studentInfo').innerHTML = `
                <div>
                    <strong>姓名：</strong> ${currentStudent.name} |
                    <strong>学号：</strong> ${currentStudent.student_id} |
                    <strong>班级：</strong> ${currentStudent.class || '未设置'}
                </div>
                <div class="points-badge">🏆 积分：${currentStudent.total_points}</div>
            `;
        }

        async function loadRules() {
            const { data: rules } = await supabase
                .from('point_rules')
                .select('*')
                .eq('enabled', true);
            const container = document.getElementById('rulesList');
            container.innerHTML = '';
            if (!rules || rules.length === 0) {
                container.innerHTML = '<p>暂无可用加分项目</p>';
                return;
            }
            rules.forEach(rule => {
                const card = document.createElement('div');
                card.className = 'rule-card';
                card.innerHTML = `
                    <h3>${rule.name}</h3>
                    <p>${rule.description || ''}</p>
                    <span class="points-tag">默认 ${rule.points} 分</span>
                    <button onclick="showApplyModal(${rule.id})">申请加分</button>
                `;
                container.appendChild(card);
            });
        }

        let selectedRuleId = null;
        window.showApplyModal = function(ruleId) {
            selectedRuleId = ruleId;
            // 填充规则下拉
            const select = document.getElementById('ruleSelect');
            select.innerHTML = '';
            supabase.from('point_rules').select('*').eq('enabled', true).then(({ data: rules }) => {
                rules.forEach(rule => {
                    const opt = document.createElement('option');
                    opt.value = rule.id;
                    opt.textContent = `${rule.name} (默认 ${rule.points} 分)`;
                    if (rule.id === ruleId) opt.selected = true;
                    select.appendChild(opt);
                });
            });
            document.getElementById('applyModal').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('applyModal').style.display = 'none';
        };

        window.submitApplication = async function() {
            const ruleId = document.getElementById('ruleSelect').value;
            const customPoints = document.getElementById('customPoints').value;
            const reason = document.getElementById('applyReason').value.trim();
            if (!reason) {
                alert('请填写申请理由');
                return;
            }
            const { error } = await supabase
                .from('applications')
                .insert({
                    student_id: currentStudent.id,
                    rule_id: ruleId,
                    custom_points: customPoints ? parseInt(customPoints) : null,
                    reason: reason,
                    status: 'pending'
                });
            if (error) {
                alert('提交失败：' + error.message);
            } else {
                alert('申请已提交');
                closeModal();
                document.getElementById('customPoints').value = '';
                document.getElementById('applyReason').value = '';
                loadApplications();
            }
        };

        async function loadApplications() {
            const { data: apps } = await supabase
                .from('applications')
                .select('*, point_rules(name)')
                .eq('student_id', currentStudent.id)
                .order('created_at', { ascending: false });
            const tbody = document.getElementById('applicationsList');
            tbody.innerHTML = '';
            if (!apps || apps.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">暂无申请记录</td></tr>';
                return;
            }
            apps.forEach(app => {
                const row = tbody.insertRow();
                const points = app.custom_points || (app.point_rules ? app.point_rules.name : '');
                const statusClass = `status-${app.status}`;
                const statusText = app.status === 'pending' ? '待审核' : (app.status === 'approved' ? '已通过' : '已拒绝');
                row.innerHTML = `
                    <td>${app.point_rules?.name || '已删除规则'}</td>
                    <td>${points}</td>
                    <td>${app.reason}</td>
                    <td><span class="${statusClass}">${statusText}</span></td>
                    <td>${new Date(app.created_at).toLocaleString()}</td>
                    <td>${app.reviewed_by ? '已处理' : '-'}</td>
                `;
            });
        }

        window.logout = function() {
            sessionStorage.removeItem('studentId');
            location.reload();
        };

        // 初始化
        checkLogin();
    </script>
</body>
</html>
