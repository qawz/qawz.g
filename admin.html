<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .login-box, .admin-panel { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 500px; max-width: 100%; }
        h2 { margin-top: 0; color: #333; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { background: #667eea; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background: #764ba2; }
        .error { color: red; font-size: 0.9em; margin: 5px 0; }
        .field-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        hr { margin: 20px 0; border: none; border-top: 1px solid #eee; }
        small { color: #666; font-size: 0.85em; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .checkbox-group input[type="checkbox"] { width: auto; margin: 0; }
        .slider-group { display: flex; align-items: center; gap: 10px; }
        .slider-group input[type=range] { flex: 1; }
        #opacityValue { font-weight: bold; min-width: 3em; text-align: right; }
    </style>
</head>
<body>
    <div id="app">
        <div id="loginBox" class="login-box">
            <h2>管理员登录</h2>
            <input type="text" id="username" placeholder="用户名" value="admin">
            <input type="password" id="password" placeholder="密码">
            <button onclick="login()">登录</button>
            <p id="loginError" class="error"></p>
        </div>

        <div id="adminPanel" class="admin-panel" style="display:none;">
            <h2>配置网站</h2>

            <!-- 板块1 -->
            <h3>板块1</h3>
            <div class="field-group">
                <label>标题</label><input type="text" id="b1Title">
            </div>
            <div class="field-group">
                <label>描述</label><textarea id="b1Desc" rows="2"></textarea>
            </div>
            <div class="field-group">
                <label>按钮文字</label><input type="text" id="b1BtnText">
            </div>
            <div class="field-group">
                <label>链接地址</label><input type="text" id="b1BtnLink" placeholder="http://...">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="b1Hidden">
                <label>隐藏此板块</label>
            </div>
            <hr>

            <!-- 板块2 -->
            <h3>板块2</h3>
            <div class="field-group">
                <label>标题</label><input type="text" id="b2Title">
            </div>
            <div class="field-group">
                <label>描述</label><textarea id="b2Desc" rows="2"></textarea>
            </div>
            <div class="field-group">
                <label>按钮文字</label><input type="text" id="b2BtnText">
            </div>
            <div class="field-group">
                <label>链接地址</label><input type="text" id="b2BtnLink">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="b2Hidden">
                <label>隐藏此板块</label>
            </div>
            <hr>

            <!-- 板块3 -->
            <h3>板块3</h3>
            <div class="field-group">
                <label>标题</label><input type="text" id="b3Title">
            </div>
            <div class="field-group">
                <label>描述</label><textarea id="b3Desc" rows="2"></textarea>
            </div>
            <div class="field-group">
                <label>按钮文字</label><input type="text" id="b3BtnText">
            </div>
            <div class="field-group">
                <label>链接地址</label><input type="text" id="b3BtnLink">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="b3Hidden">
                <label>隐藏此板块</label>
            </div>
            <hr>

            <!-- 板块4 -->
            <h3>板块4</h3>
            <div class="field-group">
                <label>标题</label><input type="text" id="b4Title">
            </div>
            <div class="field-group">
                <label>描述</label><textarea id="b4Desc" rows="2"></textarea>
            </div>
            <div class="field-group">
                <label>按钮文字</label><input type="text" id="b4BtnText">
            </div>
            <div class="field-group">
                <label>链接地址</label><input type="text" id="b4BtnLink">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="b4Hidden">
                <label>隐藏此板块</label>
            </div>
            <hr>

            <!-- 板块5 -->
            <h3>板块5</h3>
            <div class="field-group">
                <label>标题</label><input type="text" id="b5Title">
            </div>
            <div class="field-group">
                <label>描述</label><textarea id="b5Desc" rows="2"></textarea>
            </div>
            <div class="field-group">
                <label>按钮文字</label><input type="text" id="b5BtnText">
            </div>
            <div class="field-group">
                <label>链接地址</label><input type="text" id="b5BtnLink">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="b5Hidden">
                <label>隐藏此板块</label>
            </div>
            <hr>

            <!-- 背景视频 -->
            <div class="field-group">
                <label>🎬 背景视频 URL</label>
                <input type="text" id="bgVideoUrl" placeholder="https://... 或 B站嵌入链接">
                <small>支持 MP4 直链或 B站嵌入链接</small>
            </div>
            <hr>

            <!-- 卡片透明度控制 -->
            <div class="field-group">
                <label>🔮 卡片透明度</label>
                <div class="slider-group">
                    <input type="range" id="cardOpacity" min="0" max="100" value="100" step="1">
                    <span id="opacityValue">100%</span>
                </div>
                <small>设置卡片的透明度（0%完全透明，100%不透明）</small>
            </div>
            <hr>

            <!-- 修改密码 -->
            <div class="field-group">
                <label>修改密码（留空则不修改）</label>
                <input type="password" id="newPassword" placeholder="新密码">
            </div>
            <button onclick="saveConfig()">保存配置</button>
            <button onclick="logout()" style="background:#aaa;">退出登录</button>
            <p id="saveMsg" style="color:green;"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 实时显示滑块值
        const opacitySlider = document.getElementById('cardOpacity');
        const opacitySpan = document.getElementById('opacityValue');
        opacitySlider.addEventListener('input', function() {
            opacitySpan.innerText = this.value + '%';
        });

        async function loadConfigToForm() {
            const { data, error } = await supabaseClient
                .from('config')
                .select('*')
                .eq('id', 1)
                .single();
            if (error) {
                alert('读取配置失败：' + error.message);
                return;
            }
            if (data) {
                // 板块1
                document.getElementById('b1Title').value = data.board1_title || '';
                document.getElementById('b1Desc').value = data.board1_description || '';
                document.getElementById('b1BtnText').value = data.board1_button_text || '';
                document.getElementById('b1BtnLink').value = data.board1_button_link || '';
                document.getElementById('b1Hidden').checked = data.board1_hidden || false;
                // 板块2
                document.getElementById('b2Title').value = data.board2_title || '';
                document.getElementById('b2Desc').value = data.board2_description || '';
                document.getElementById('b2BtnText').value = data.board2_button_text || '';
                document.getElementById('b2BtnLink').value = data.board2_button_link || '';
                document.getElementById('b2Hidden').checked = data.board2_hidden || false;
                // 板块3
                document.getElementById('b3Title').value = data.board3_title || '';
                document.getElementById('b3Desc').value = data.board3_description || '';
                document.getElementById('b3BtnText').value = data.board3_button_text || '';
                document.getElementById('b3BtnLink').value = data.board3_button_link || '';
                document.getElementById('b3Hidden').checked = data.board3_hidden || false;
                // 板块4
                document.getElementById('b4Title').value = data.board4_title || '';
                document.getElementById('b4Desc').value = data.board4_description || '';
                document.getElementById('b4BtnText').value = data.board4_button_text || '';
                document.getElementById('b4BtnLink').value = data.board4_button_link || '';
                document.getElementById('b4Hidden').checked = data.board4_hidden || false;
                // 板块5
                document.getElementById('b5Title').value = data.board5_title || '';
                document.getElementById('b5Desc').value = data.board5_description || '';
                document.getElementById('b5BtnText').value = data.board5_button_text || '';
                document.getElementById('b5BtnLink').value = data.board5_button_link || '';
                document.getElementById('b5Hidden').checked = data.board5_hidden || false;
                // 背景视频
                document.getElementById('bgVideoUrl').value = data.background_video_url || '';
                // 卡片透明度
                const opacity = data.card_opacity !== null ? data.card_opacity : 100;
                document.getElementById('cardOpacity').value = opacity;
                document.getElementById('opacityValue').innerText = opacity + '%';
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username !== 'admin') {
                document.getElementById('loginError').innerText = '用户名或密码错误';
                return;
            }
            const { data, error } = await supabaseClient
                .from('config')
                .select('admin_password')
                .eq('id', 1)
                .single();
            if (error || !data) {
                document.getElementById('loginError').innerText = '验证失败，请稍后重试';
                return;
            }
            if (data.admin_password === password) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                await loadConfigToForm();
                document.getElementById('loginError').innerText = '';
            } else {
                document.getElementById('loginError').innerText = '用户名或密码错误';
            }
        }

        async function saveConfig() {
            const updates = {
                board1_title: document.getElementById('b1Title').value,
                board1_description: document.getElementById('b1Desc').value,
                board1_button_text: document.getElementById('b1BtnText').value,
                board1_button_link: document.getElementById('b1BtnLink').value,
                board1_hidden: document.getElementById('b1Hidden').checked,
                board2_title: document.getElementById('b2Title').value,
                board2_description: document.getElementById('b2Desc').value,
                board2_button_text: document.getElementById('b2BtnText').value,
                board2_button_link: document.getElementById('b2BtnLink').value,
                board2_hidden: document.getElementById('b2Hidden').checked,
                board3_title: document.getElementById('b3Title').value,
                board3_description: document.getElementById('b3Desc').value,
                board3_button_text: document.getElementById('b3BtnText').value,
                board3_button_link: document.getElementById('b3BtnLink').value,
                board3_hidden: document.getElementById('b3Hidden').checked,
                board4_title: document.getElementById('b4Title').value,
                board4_description: document.getElementById('b4Desc').value,
                board4_button_text: document.getElementById('b4BtnText').value,
                board4_button_link: document.getElementById('b4BtnLink').value,
                board4_hidden: document.getElementById('b4Hidden').checked,
                board5_title: document.getElementById('b5Title').value,
                board5_description: document.getElementById('b5Desc').value,
                board5_button_text: document.getElementById('b5BtnText').value,
                board5_button_link: document.getElementById('b5BtnLink').value,
                board5_hidden: document.getElementById('b5Hidden').checked,
                background_video_url: document.getElementById('bgVideoUrl').value,
                card_opacity: parseInt(document.getElementById('cardOpacity').value)
            };

            const newPass = document.getElementById('newPassword').value;
            if (newPass) {
                updates.admin_password = newPass;
            }

            const { error } = await supabaseClient
                .from('config')
                .update(updates)
                .eq('id', 1);

            if (error) {
                document.getElementById('saveMsg').innerText = '保存失败：' + error.message;
                document.getElementById('saveMsg').style.color = 'red';
            } else {
                document.getElementById('saveMsg').innerText = '保存成功！';
                document.getElementById('saveMsg').style.color = 'green';
                document.getElementById('newPassword').value = '';
                setTimeout(() => document.getElementById('saveMsg').innerText = '', 2000);
            }
        }

        function logout() {
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('password').value = '';
            document.getElementById('newPassword').value = '';
        }
    </script>
</body>
</html>
