<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 动态板块</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* ... 样式保持不变，增加板块列表的样式 ... */
    </style>
</head>
<body>
    <div id="app">
        <!-- 登录框不变 -->
        <div id="loginBox" class="login-box">
            <h2>管理员登录</h2>
            <input type="text" id="username" placeholder="用户名" value="admin">
            <input type="password" id="password" placeholder="密码">
            <button onclick="login()">登录</button>
            <p id="loginError" class="error"></p>
        </div>

        <!-- 管理面板 -->
        <div id="adminPanel" class="admin-panel" style="display:none;">
            <h2>配置网站</h2>

            <!-- 全局设置区域（与之前相同） -->
            <h3>全局外观</h3>
            <!-- ... 主区域透明度、卡片透明度、背景视频、背景图片、分页数量、修改密码等控件保持不变 ... -->

            <hr>

            <!-- 动态板块管理 -->
            <h3>📦 板块管理 <button onclick="showAddBlockModal()" style="width:auto; padding:5px 10px; margin-left:10px;">➕ 添加板块</button></h3>
            <div id="blocksList" class="blocks-list">
                <!-- 板块列表会动态渲染到这里 -->
            </div>
            <hr>

            <!-- 保存所有设置 -->
            <button onclick="saveAll()">保存所有配置</button>
            <button onclick="logout()" style="background:#aaa;">退出登录</button>
            <p id="saveMsg" style="color:green;"></p>
        </div>
    </div>

    <!-- 添加/编辑板块的模态框（简单使用内联，也可以用dialog） -->
    <div id="blockModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:15px; width:400px;">
            <h3 id="modalTitle">添加板块</h3>
            <input type="hidden" id="editingBlockId">
            <div class="field-group"><label>标题</label><input type="text" id="modalTitleInput"></div>
            <div class="field-group"><label>描述</label><textarea id="modalDescInput" rows="2"></textarea></div>
            <div class="field-group"><label>按钮文字</label><input type="text" id="modalBtnTextInput"></div>
            <div class="field-group"><label>链接地址</label><input type="text" id="modalBtnLinkInput"></div>
            <div class="checkbox-group"><input type="checkbox" id="modalHiddenCheck"> <label>隐藏此板块</label></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="saveBlock()">保存</button>
                <button onclick="hideModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 全局变量
        let blocks = [];
        let globalConfig = {};

        // 登录等函数保持不变 ...

        async function loadAll() {
            // 加载全局配置
            const { data: configData, error: configError } = await supabase
                .from('config')
                .select('*')
                .eq('id', 1)
                .single();
            if (configError) alert('读取配置失败：' + configError.message);
            else globalConfig = configData;

            // 加载板块
            const { data: blocksData, error: blocksError } = await supabase
                .from('blocks')
                .select('*')
                .order('sort_order', { ascending: true });
            if (blocksError) alert('读取板块失败：' + blocksError.message);
            else blocks = blocksData;

            renderBlocks();
        }

        function renderBlocks() {
            const container = document.getElementById('blocksList');
            container.innerHTML = '';
            blocks.forEach((block, index) => {
                const div = document.createElement('div');
                div.className = 'block-item';
                div.draggable = true;
                div.dataset.id = block.id;
                div.dataset.index = index;
                div.innerHTML = `
                    <span style="cursor:grab;">⋮⋮</span>
                    <strong>${block.title || '无标题'}</strong> ${block.hidden ? '(隐藏)' : ''}
                    <div style="margin-left:auto;">
                        <button onclick="editBlock(${block.id})">✏️</button>
                        <button onclick="deleteBlock(${block.id})">🗑️</button>
                    </div>
                `;
                // 拖拽事件
                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragover', handleDragOver);
                div.addEventListener('drop', handleDrop);
                container.appendChild(div);
            });
        }

        // 拖拽排序逻辑
        let draggedIndex = null;
        function handleDragStart(e) {
            draggedIndex = e.target.closest('.block-item').dataset.index;
        }
        function handleDragOver(e) {
            e.preventDefault();
        }
        function handleDrop(e) {
            e.preventDefault();
            const targetIndex = e.target.closest('.block-item')?.dataset.index;
            if (draggedIndex !== null && targetIndex !== null && draggedIndex !== targetIndex) {
                // 交换顺序
                const newBlocks = [...blocks];
                const [moved] = newBlocks.splice(draggedIndex, 1);
                newBlocks.splice(targetIndex, 0, moved);
                // 更新 sort_order
                newBlocks.forEach((block, idx) => { block.sort_order = idx; });
                blocks = newBlocks;
                renderBlocks();
            }
        }

        // 添加/编辑模态框
        function showAddBlockModal() {
            document.getElementById('modalTitle').innerText = '添加板块';
            document.getElementById('editingBlockId').value = '';
            document.getElementById('modalTitleInput').value = '';
            document.getElementById('modalDescInput').value = '';
            document.getElementById('modalBtnTextInput').value = '';
            document.getElementById('modalBtnLinkInput').value = '';
            document.getElementById('modalHiddenCheck').checked = false;
            document.getElementById('blockModal').style.display = 'flex';
        }

        function editBlock(id) {
            const block = blocks.find(b => b.id === id);
            if (!block) return;
            document.getElementById('modalTitle').innerText = '编辑板块';
            document.getElementById('editingBlockId').value = id;
            document.getElementById('modalTitleInput').value = block.title || '';
            document.getElementById('modalDescInput').value = block.description || '';
            document.getElementById('modalBtnTextInput').value = block.button_text || '';
            document.getElementById('modalBtnLinkInput').value = block.button_link || '';
            document.getElementById('modalHiddenCheck').checked = block.hidden || false;
            document.getElementById('blockModal').style.display = 'flex';
        }

        function hideModal() {
            document.getElementById('blockModal').style.display = 'none';
        }

        async function saveBlock() {
            const id = document.getElementById('editingBlockId').value;
            const blockData = {
                title: document.getElementById('modalTitleInput').value,
                description: document.getElementById('modalDescInput').value,
                button_text: document.getElementById('modalBtnTextInput').value,
                button_link: document.getElementById('modalBtnLinkInput').value,
                hidden: document.getElementById('modalHiddenCheck').checked
            };
            if (id) {
                // 更新
                const { error } = await supabase
                    .from('blocks')
                    .update(blockData)
                    .eq('id', id);
                if (error) alert('更新失败：' + error.message);
            } else {
                // 新增，sort_order 设为当前最大+1
                const maxOrder = blocks.length > 0 ? Math.max(...blocks.map(b => b.sort_order)) : 0;
                blockData.sort_order = maxOrder + 1;
                const { error } = await supabase
                    .from('blocks')
                    .insert([blockData]);
                if (error) alert('添加失败：' + error.message);
            }
            hideModal();
            await loadAll(); // 重新加载
        }

        async function deleteBlock(id) {
            if (!confirm('确定删除此板块吗？')) return;
            const { error } = await supabase
                .from('blocks')
                .delete()
                .eq('id', id);
            if (error) alert('删除失败：' + error.message);
            else await loadAll();
        }

        async function saveAll() {
            // 保存全局配置（略，与之前相同）
            // 保存板块排序顺序
            for (let i = 0; i < blocks.length; i++) {
                const block = blocks[i];
                await supabase
                    .from('blocks')
                    .update({ sort_order: i })
                    .eq('id', block.id);
            }
            alert('保存成功！');
        }

        // 登录成功后调用 loadAll
        async function login() { /* ... 同前 ... */ }
    </script>
</body>
</html>
