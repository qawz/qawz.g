<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .login-box, .admin-panel { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 500px; max-width: 100%; }
        h2 { margin-top: 0; color: #333; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { background: #667eea; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background: #764ba2; }
        .error { color: red; font-size: 0.9em; margin: 5px 0; }
        .field-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        hr { margin: 20px 0; border: none; border-top: 1px solid #eee; }
        small { color: #666; font-size: 0.85em; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .checkbox-group input[type="checkbox"] { width: auto; margin: 0; }
        .slider-group { display: flex; align-items: center; gap: 10px; }
        .slider-group input[type=range] { flex: 1; }
        #containerOpacityValue, #opacityValue { font-weight: bold; min-width: 3em; text-align: right; }
        .row-flex { display: flex; gap: 10px; align-items: center; }
        .row-flex input[type=number] { width: 80px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="loginBox" class="login-box">
            <h2>管理员登录</h2>
            <input type="text" id="username" placeholder="用户名" value="admin">
            <input type="password" id="password" placeholder="密码">
            <button onclick="login()">登录</button>
            <p id="loginError" class="error"></p>
        </div>

        <div id="adminPanel" class="admin-panel" style="display:none;">
            <h2>配置网站</h2>

            <!-- 全局外观 -->
            <h3>全局外观</h3>
            <div class="field-group">
                <label>🔲 主区域背景透明度</label>
                <div class="slider-group">
                    <input type="range" id="containerOpacity" min="0" max="100" value="100" step="1">
                    <span id="containerOpacityValue">100%</span>
                </div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="containerBlur">
                <label>启用背景模糊效果</label>
            </div>
            <div class="field-group">
                <label>🔮 卡片透明度</label>
                <div class="slider-group">
                    <input type="range" id="cardOpacity" min="0" max="100" value="100" step="1">
                    <span id="opacityValue">100%</span>
                </div>
            </div>
            <div class="field-group">
                <label>🎬 背景视频 URL</label>
                <input type="text" id="bgVideoUrl" placeholder="https://... 或 B站嵌入链接">
                <small>支持 MP4 直链或 B站嵌入链接</small>
            </div>
            <div class="field-group">
                <label>🖼️ 背景图片 URL</label>
                <input type="text" id="bgImageUrl" placeholder="https://...">
                <small>无视频时使用此图片</small>
            </div>
            <div class="field-group">
                <label>📄 每页显示卡片数（仅用于旧版）</label>
                <input type="number" id="cardsPerPage" value="4" min="1" max="10">
            </div>
            <hr>

            <!-- 板块1 -->
            <h3>板块1</h3>
            <div class="row-flex">
                <div style="flex:1"><label>标题</label><input type="text" id="b1Title"></div>
                <div style="width:100px"><label>顺序</label><input type="number" id="b1Order" value="0"></div>
            </div>
            <div class="field-group"><label>描述</label><textarea id="b1Desc" rows="2"></textarea></div>
            <div class="field-group"><label>按钮文字</label><input type="text" id="b1BtnText"></div>
            <div class="field-group"><label>链接地址</label><input type="text" id="b1BtnLink"></div>
            <div class="checkbox-group"><input type="checkbox" id="b1Hidden"><label>隐藏此板块</label></div>
            <hr>
            <!-- 板块2 -->
            <h3>板块2</h3>
            <div class="row-flex"><div style="flex:1"><label>标题</label><input type="text" id="b2Title"></div><div style="width:100px"><label>顺序</label><input type="number" id="b2Order" value="0"></div></div>
            <div class="field-group"><label>描述</label><textarea id="b2Desc" rows="2"></textarea></div>
            <div class="field-group"><label>按钮文字</label><input type="text" id="b2BtnText"></div>
            <div class="field-group"><label>链接地址</label><input type="text" id="b2BtnLink"></div>
            <div class="checkbox-group"><input type="checkbox" id="b2Hidden"><label>隐藏此板块</label></div>
            <hr>
            <!-- 板块3 -->
            <h3>板块3</h3>
            <div class="row-flex"><div style="flex:1"><label>标题</label><input type="text" id="b3Title"></div><div style="width:100px"><label>顺序</label><input type="number" id="b3Order" value="0"></div></div>
            <div class="field-group"><label>描述</label><textarea id="b3Desc" rows="2"></textarea></div>
            <div class="field-group"><label>按钮文字</label><input type="text" id="b3BtnText"></div>
            <div class="field-group"><label>链接地址</label><input type="text" id="b3BtnLink"></div>
            <div class="checkbox-group"><input type="checkbox" id="b3Hidden"><label>隐藏此板块</label></div>
            <hr>
            <!-- 板块4 -->
            <h3>板块4</h3>
            <div class="row-flex"><div style="flex:1"><label>标题</label><input type="text" id="b4Title"></div><div style="width:100px"><label>顺序</label><input type="number" id="b4Order" value="0"></div></div>
            <div class="field-group"><label>描述</label><textarea id="b4Desc" rows="2"></textarea></div>
            <div class="field-group"><label>按钮文字</label><input type="text" id="b4BtnText"></div>
            <div class="field-group"><label>链接地址</label><input type="text" id="b4BtnLink"></div>
            <div class="checkbox-group"><input type="checkbox" id="b4Hidden"><label>隐藏此板块</label></div>
            <hr>
            <!-- 板块5 -->
            <h3>板块5</h3>
            <div class="row-flex"><div style="flex:1"><label>标题</label><input type="text" id="b5Title"></div><div style="width:100px"><label>顺序</label><input type="number" id="b5Order" value="0"></div></div>
            <div class="field-group"><label>描述</label><textarea id="b5Desc" rows="2"></textarea></div>
            <div class="field-group"><label>按钮文字</label><input type="text" id="b5BtnText"></div>
            <div class="field-group"><label>链接地址</label><input type="text" id="b5BtnLink"></div>
            <div class="checkbox-group"><input type="checkbox" id="b5Hidden"><label>隐藏此板块</label></div>
            <hr>

            <!-- 板块6（液态玻璃卡片，小鹰宇宙-首页） -->
            <h3>板块6（液态玻璃卡片 · 故事首页）</h3>
            <div class="row-flex"><div style="flex:1"><label>标题</label><input type="text" id="b6Title"></div><div style="width:100px"><label>顺序</label><input type="number" id="b6Order" value="0"></div></div>
            <div class="field-group"><label>描述</label><textarea id="b6Desc" rows="2"></textarea></div>
            <div class="field-group"><label>按钮文字</label><input type="text" id="b6BtnText"></div>
            <div class="field-group"><label>链接地址</label><input type="text" id="b6BtnLink" placeholder="/story-platform/index.html"></div>
            <div class="checkbox-group"><input type="checkbox" id="b6Hidden"><label>隐藏此板块</label></div>
            <hr>
            <!-- 板块7（液态玻璃卡片，小鹰宇宙-编者后台） -->
            <h3>板块7（液态玻璃卡片 · 编者后台）</h3>
            <div class="row-flex"><div style="flex:1"><label>标题</label><input type="text" id="b7Title"></div><div style="width:100px"><label>顺序</label><input type="number" id="b7Order" value="0"></div></div>
            <div class="field-group"><label>描述</label><textarea id="b7Desc" rows="2"></textarea></div>
            <div class="field-group"><label>按钮文字</label><input type="text" id="b7BtnText"></div>
            <div class="field-group"><label>链接地址</label><input type="text" id="b7BtnLink" placeholder="/story-platform/editor.html"></div>
            <div class="checkbox-group"><input type="checkbox" id="b7Hidden"><label>隐藏此板块</label></div>
            <hr>
            <!-- 板块8（液态玻璃卡片，小鹰宇宙-管理后台） -->
            <h3>板块8（液态玻璃卡片 · 管理后台）</h3>
            <div class="row-flex"><div style="flex:1"><label>标题</label><input type="text" id="b8Title"></div><div style="width:100px"><label>顺序</label><input type="number" id="b8Order" value="0"></div></div>
            <div class="field-group"><label>描述</label><textarea id="b8Desc" rows="2"></textarea></div>
            <div class="field-group"><label>按钮文字</label><input type="text" id="b8BtnText"></div>
            <div class="field-group"><label>链接地址</label><input type="text" id="b8BtnLink" placeholder="/story-platform/admin.html"></div>
            <div class="checkbox-group"><input type="checkbox" id="b8Hidden"><label>隐藏此板块</label></div>
            <hr>

            <!-- 修改密码 -->
            <div class="field-group">
                <label>修改密码（留空则不修改）</label>
                <input type="password" id="newPassword" placeholder="新密码">
            </div>
            <button onclick="saveConfig()">保存配置</button>
            <button onclick="logout()" style="background:#aaa;">退出登录</button>
            <p id="saveMsg" style="color:green;"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 实时显示滑块值
        document.getElementById('containerOpacity').addEventListener('input', (e) => {
            document.getElementById('containerOpacityValue').innerText = e.target.value + '%';
        });
        document.getElementById('cardOpacity').addEventListener('input', (e) => {
            document.getElementById('opacityValue').innerText = e.target.value + '%';
        });

        async function loadConfigToForm() {
            const { data, error } = await supabaseClient
                .from('config')
                .select('*')
                .eq('id', 1)
                .single();
            if (error) {
                alert('读取配置失败：' + error.message);
                return;
            }
            if (data) {
                // 全局设置
                document.getElementById('containerOpacity').value = data.container_opacity ?? 100;
                document.getElementById('containerOpacityValue').innerText = (data.container_opacity ?? 100) + '%';
                document.getElementById('containerBlur').checked = data.container_blur ?? false;
                document.getElementById('cardOpacity').value = data.card_opacity ?? 100;
                document.getElementById('opacityValue').innerText = (data.card_opacity ?? 100) + '%';
                document.getElementById('bgVideoUrl').value = data.background_video_url || '';
                document.getElementById('bgImageUrl').value = data.background_image || '';
                document.getElementById('cardsPerPage').value = data.cards_per_page || 4;

                // 板块1-5
                for (let i = 1; i <= 5; i++) {
                    document.getElementById(`b${i}Title`).value = data[`board${i}_title`] || '';
                    document.getElementById(`b${i}Desc`).value = data[`board${i}_description`] || '';
                    document.getElementById(`b${i}BtnText`).value = data[`board${i}_button_text`] || '';
                    document.getElementById(`b${i}BtnLink`).value = data[`board${i}_button_link`] || '';
                    document.getElementById(`b${i}Hidden`).checked = data[`board${i}_hidden`] || false;
                    document.getElementById(`b${i}Order`).value = data[`board${i}_order`] || 0;
                }
                // 板块6-8
                for (let i = 6; i <= 8; i++) {
                    document.getElementById(`b${i}Title`).value = data[`board${i}_title`] || '';
                    document.getElementById(`b${i}Desc`).value = data[`board${i}_description`] || '';
                    document.getElementById(`b${i}BtnText`).value = data[`board${i}_button_text`] || '';
                    document.getElementById(`b${i}BtnLink`).value = data[`board${i}_button_link`] || '';
                    document.getElementById(`b${i}Hidden`).checked = data[`board${i}_hidden`] || false;
                    document.getElementById(`b${i}Order`).value = data[`board${i}_order`] || 0;
                }
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username !== 'admin') {
                document.getElementById('loginError').innerText = '用户名或密码错误';
                return;
            }
            const { data, error } = await supabaseClient
                .from('config')
                .select('admin_password')
                .eq('id', 1)
                .single();
            if (error || !data) {
                document.getElementById('loginError').innerText = '验证失败，请稍后重试';
                return;
            }
            if (data.admin_password === password) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                await loadConfigToForm();
                document.getElementById('loginError').innerText = '';
            } else {
                document.getElementById('loginError').innerText = '用户名或密码错误';
            }
        }

async function saveConfig() {
    const updates = {
        container_opacity: parseInt(document.getElementById('containerOpacity').value),
        container_blur: document.getElementById('containerBlur').checked,
        card_opacity: parseInt(document.getElementById('cardOpacity').value),
        background_video_url: document.getElementById('bgVideoUrl').value,
        background_image: document.getElementById('bgImageUrl').value,
        cards_per_page: parseInt(document.getElementById('cardsPerPage').value),
    };
    // 板块1-5
    for (let i = 1; i <= 5; i++) {
        updates[`board${i}_title`] = document.getElementById(`b${i}Title`).value;
        updates[`board${i}_description`] = document.getElementById(`b${i}Desc`).value;
        updates[`board${i}_button_text`] = document.getElementById(`b${i}BtnText`).value;
        updates[`board${i}_button_link`] = document.getElementById(`b${i}BtnLink`).value;
        updates[`board${i}_hidden`] = document.getElementById(`b${i}Hidden`).checked;
        updates[`board${i}_order`] = parseInt(document.getElementById(`b${i}Order`).value) || 0;
    }
    // 板块6-8
    for (let i = 6; i <= 8; i++) {
        updates[`board${i}_title`] = document.getElementById(`b${i}Title`).value;
        updates[`board${i}_description`] = document.getElementById(`b${i}Desc`).value;
        updates[`board${i}_button_text`] = document.getElementById(`b${i}BtnText`).value;
        updates[`board${i}_button_link`] = document.getElementById(`b${i}BtnLink`).value;
        updates[`board${i}_hidden`] = document.getElementById(`b${i}Hidden`).checked;
        updates[`board${i}_order`] = parseInt(document.getElementById(`b${i}Order`).value) || 0;
    }

    const newPass = document.getElementById('newPassword').value;
    if (newPass) {
        updates.admin_password = newPass;
    }

    // 执行更新并检查影响行数
    const { data, error } = await supabaseClient
        .from('config')
        .update(updates)
        .eq('id', 1)
        .select();  // 加上 .select() 可以返回更新后的数据

    if (error) {
        document.getElementById('saveMsg').innerText = '保存失败：' + error.message;
        document.getElementById('saveMsg').style.color = 'red';
        console.error('更新错误:', error);
    } else if (data && data.length === 0) {
        document.getElementById('saveMsg').innerText = '保存失败：未找到对应的配置行（id=1）';
        document.getElementById('saveMsg').style.color = 'red';
    } else {
        document.getElementById('saveMsg').innerText = '保存成功！';
        document.getElementById('saveMsg').style.color = 'green';
        document.getElementById('newPassword').value = '';
        setTimeout(() => document.getElementById('saveMsg').innerText = '', 2000);
    }
}
    </script>
</body>
</html>
