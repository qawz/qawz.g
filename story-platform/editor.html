<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编者后台 - 小鹰宇宙</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: white;
            font-family: system-ui;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e2e8f0;
        }
        input, textarea, button {
            margin: 0.5rem 0;
            padding: 0.6rem;
            border-radius: 0.5rem;
            border: 1px solid #cbd5e1;
            width: 100%;
            max-width: 500px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            width: auto;
            padding: 0.6rem 1.2rem;
        }
        .story-item {
            border-left: 3px solid #3b82f6;
            margin: 1rem 0;
            padding-left: 1rem;
        }
        .back {
            display: inline-block;
            margin-bottom: 1rem;
            color: #3b82f6;
            text-decoration: none;
        }
    </style>
</head>
<body>
<a href="index.html" class="back">← 返回首页</a>
<h1>✍️ 编者后台</h1>
<div id="userRole"></div>
<hr>
<div class="card">
    <h3>➕ 创建新故事</h3>
    <input type="text" id="newTitle" placeholder="故事标题">
    <input type="text" id="newCover" placeholder="封面 emoji (例如 📖)">
    <textarea id="newDesc" rows="3" placeholder="故事简介"></textarea>
    <button id="createStoryBtn">创建故事</button>
</div>
<div class="card">
    <h3>📚 我的故事</h3>
    <div id="storiesList"></div>
</div>

<script>
    const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null, userRole = null;

    async function init() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
        userRole = profile?.role;
        document.getElementById('userRole').innerText = `当前角色：${userRole === 'admin' ? '超级管理员' : (userRole === 'editor' ? '编者' : '读者')}`;
        if (userRole !== 'editor' && userRole !== 'admin') {
            alert('您没有编者权限，请联系管理员将您的角色设置为 editor 或 admin');
            window.location.href = 'index.html';
            return;
        }
        loadStories();
    }

    async function loadStories() {
        let query = supabase.from('stories').select('*, profiles(username)');
        if (userRole !== 'admin') query = query.eq('author_id', currentUser.id);
        const { data } = await query.order('created_at', { ascending: false });
        const container = document.getElementById('storiesList');
        container.innerHTML = '';
        for (const story of data) {
            const div = document.createElement('div');
            div.className = 'story-item';
            div.innerHTML = `
                <strong>${story.title}</strong> ${story.status === 'draft' ? '(草稿)' : ''}
                <br><small>作者：${story.profiles?.username || '未知'}</small>
                <br><button onclick="editStory('${story.id}')">编辑信息</button>
                <button onclick="manageChapters('${story.id}')">管理章节</button>
                <button onclick="deleteStory('${story.id}')">删除</button>
                <hr>
            `;
            container.appendChild(div);
        }
    }

    window.editStory = async (id) => {
        const newTitle = prompt('新标题');
        if (newTitle) await supabase.from('stories').update({ title: newTitle }).eq('id', id);
        loadStories();
    };
    window.manageChapters = (id) => {
        window.location.href = `chapters.html?storyId=${id}`;
    };
    window.deleteStory = async (id) => {
        if (confirm('删除故事会同时删除所有章节，确定吗？')) {
            await supabase.from('stories').delete().eq('id', id);
            loadStories();
        }
    };
    document.getElementById('createStoryBtn').onclick = async () => {
        const title = document.getElementById('newTitle').value.trim();
        const cover = document.getElementById('newCover').value.trim();
        const desc = document.getElementById('newDesc').value.trim();
        if (!title) return alert('标题不能为空');
        await supabase.from('stories').insert({
            title, cover_emoji: cover || '📖', description: desc, author_id: currentUser.id, status: 'published'
        });
        document.getElementById('newTitle').value = '';
        document.getElementById('newCover').value = '';
        document.getElementById('newDesc').value = '';
        loadStories();
    };
    init();
</script>
</body>
</html>
