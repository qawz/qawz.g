<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编者后台 - 小鹰宇宙</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #eef2f5;
            font-family: system-ui;
            padding-bottom: 80px;
        }
        .glass-card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: 0.2s;
        }
        input, textarea, button {
            margin: 0.5rem 0;
            padding: 0.6rem;
            border-radius: 2rem;
            border: 1px solid #cbd5e1;
            background: rgba(255,255,255,0.8);
            width: 100%;
            max-width: 500px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            width: auto;
            padding: 0.6rem 1.2rem;
        }
        .story-item {
            border-left: 3px solid #3b82f6;
            margin: 1rem 0;
            padding-left: 1rem;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.5);
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #2c3e66;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem;
            border-radius: 2rem;
            transition: 0.2s;
        }
        .nav-item:hover {
            background: rgba(59,130,246,0.2);
        }
        .back {
            display: inline-block;
            margin-bottom: 1rem;
            color: #3b82f6;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container" style="max-width:1000px; margin:2rem auto; padding:0 1.5rem;">
    <a href="index.html" class="back">← 返回首页</a>
    <h1>编者后台</h1>
    <div id="userRole"></div>

    <div class="glass-card">
        <h3>个人简介</h3>
        <textarea id="userBio" rows="3" placeholder="介绍一下自己吧"></textarea>
        <button id="updateBioBtn">更新简介</button>
    </div>

    <div class="glass-card">
        <h3>创建新书</h3>
        <input type="text" id="newTitle" placeholder="书名">
        <input type="text" id="newCoverUrl" placeholder="封面图片路径 (如 /books/cover.jpg)">
        <textarea id="newDesc" rows="3" placeholder="简介"></textarea>
        <button id="createStoryBtn">创建图书</button>
    </div>

    <div class="glass-card">
        <h3>我的图书</h3>
        <div id="storiesList"></div>
    </div>

    <!-- 底部液态玻璃导航栏 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">首页</a>
        <a href="#" class="nav-item" id="myProfileNav">我的</a>
        <a href="editor.html" class="nav-item">编者后台</a>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null, userRole = null, userId = null;

    async function init() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = 'index.html'; return; }
        currentUser = user; userId = user.id;
        const { data: profile } = await supabase.from('profiles').select('role, bio').eq('id', userId).single();
        userRole = profile?.role;
        document.getElementById('userRole').innerText = `当前角色：${userRole === 'admin' ? '管理员' : (userRole === 'editor' ? '编者' : '读者')}`;
        if (userRole !== 'editor' && userRole !== 'admin') {
            alert('您没有编者权限，请联系管理员');
            window.location.href = 'index.html';
            return;
        }
        document.getElementById('userBio').value = profile?.bio || '';
        loadStories();
    }

    document.getElementById('updateBioBtn').onclick = async () => {
        const bio = document.getElementById('userBio').value;
        const { error } = await supabase.from('profiles').update({ bio }).eq('id', userId);
        if (error) alert('更新失败：' + error.message);
        else alert('简介已更新');
    };

    async function loadStories() {
        let query = supabase.from('stories').select('*, profiles(username)');
        if (userRole !== 'admin') query = query.eq('author_id', userId);
        const { data } = await query.order('created_at', { ascending: false });
        const container = document.getElementById('storiesList');
        container.innerHTML = '';
        for (const story of data) {
            const div = document.createElement('div');
            div.className = 'story-item';
            div.innerHTML = `
                <strong>${story.title}</strong> ${story.status === 'draft' ? '(草稿)' : ''}
                <br><small>作者：${story.profiles?.username || '未知'}</small>
                <br><button onclick="editStory('${story.id}')">编辑信息</button>
                <button onclick="manageChapters('${story.id}')">管理章节</button>
                <button onclick="deleteStory('${story.id}')">删除</button>
                <hr>
            `;
            container.appendChild(div);
        }
    }

    window.editStory = async (id) => {
        const newTitle = prompt('新书名');
        const newCover = prompt('新封面路径');
        const newDesc = prompt('新简介');
        if (newTitle) await supabase.from('stories').update({ title: newTitle }).eq('id', id);
        if (newCover) await supabase.from('stories').update({ cover_url: newCover }).eq('id', id);
        if (newDesc) await supabase.from('stories').update({ description: newDesc }).eq('id', id);
        loadStories();
    };
    window.manageChapters = (id) => { window.location.href = `chapters.html?storyId=${id}`; };
    window.deleteStory = async (id) => {
        if (confirm('删除图书会同时删除所有章节，确定吗？')) {
            await supabase.from('stories').delete().eq('id', id);
            loadStories();
        }
    };
    document.getElementById('createStoryBtn').onclick = async () => {
        const title = document.getElementById('newTitle').value.trim();
        const cover = document.getElementById('newCoverUrl').value.trim();
        const desc = document.getElementById('newDesc').value.trim();
        if (!title) return alert('书名不能为空');
        await supabase.from('stories').insert({
            title, cover_url: cover || '/books/default.jpg', description: desc, author_id: userId, status: 'published'
        });
        document.getElementById('newTitle').value = '';
        document.getElementById('newCoverUrl').value = '';
        document.getElementById('newDesc').value = '';
        loadStories();
    };
    document.getElementById('myProfileNav')?.addEventListener('click', (e) => {
        e.preventDefault();
        alert(`用户：${currentUser.email}\n简介：${document.getElementById('userBio').value || '未填写'}`);
    });
    init();
</script>
</body>
</html>
