<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小鹰宇宙 · 故事创写平台</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-bottom: 80px;
        }

        /* 液态玻璃容器 */
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }

        /* 导航栏（液态玻璃） */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.5);
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 600;
            color: #2c3e66;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .nav-links a {
            text-decoration: none;
            color: #2c3e66;
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            transition: 0.2s;
        }
        .nav-links a:hover {
            background: rgba(59,130,246,0.2);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255,255,255,0.5);
            border-radius: 2rem;
            padding: 0.3rem 1rem;
        }
        .role-badge {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
        }
        button {
            background: #3b82f6;
            border: none;
            padding: 6px 14px;
            border-radius: 1.5rem;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #3b82f6;
            color: #3b82f6;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 2.5rem;
            color: #1e293b;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .book-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.8);
        }
        .book-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #d1d5db;
        }
        .book-info {
            padding: 1rem;
        }
        .book-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .book-author {
            font-size: 0.85rem;
            color: #3b82f6;
            margin-bottom: 0.5rem;
        }
        .book-desc {
            font-size: 0.85rem;
            color: #4b5563;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .auth-card {
            max-width: 400px;
            margin: 10vh auto;
            padding: 2rem;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 2rem;
            background: rgba(255,255,255,0.8);
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        .footer {
            text-align: center;
            padding: 1.5rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    const SUPABASE_URL = 'https://tuuyhasycrdbgqzrcbhp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dXloYXN5Y3JkYmdxenJjYmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODIyMjYsImV4cCI6MjA4Nzc1ODIyNn0.E-NrBCqbRIINpyPhtpw20H7iMiUnJmJ0aCv7QjXdE8k';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;

    function renderLogin() {
        document.getElementById('app').innerHTML = `
            <div class="glass-card auth-card">
                <h2 style="margin-bottom:1rem;">小鹰宇宙</h2>
                <p style="margin-bottom:1rem;">登录后即可阅读和创作故事</p>
                <input type="email" id="email" placeholder="邮箱">
                <input type="password" id="password" placeholder="密码">
                <button id="loginBtn" style="width:100%;">登录</button>
                <button id="registerBtn" class="btn-outline" style="width:100%; margin-top:0.5rem;">注册新账号</button>
                <div id="loginError" class="error-msg"></div>
            </div>
        `;
        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if (!email || !pass) { document.getElementById('loginError').innerText = '请填写邮箱和密码'; return; }
            const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
            if (error) document.getElementById('loginError').innerText = error.message;
            else location.reload();
        };
        document.getElementById('registerBtn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if (!email || !pass) { document.getElementById('loginError').innerText = '请填写邮箱和密码'; return; }
            const { error } = await supabase.auth.signUp({ email, password: pass });
            if (error) document.getElementById('loginError').innerText = error.message;
            else alert('注册成功！请登录邮箱验证（如需），现在可登录');
        };
    }

    async function loadStories() {
        const { data, error } = await supabase
            .from('stories')
            .select('*, profiles(username)')
            .eq('status', 'published')
            .order('created_at', { ascending: false });
        if (error) return [];
        return data;
    }

    async function renderHome() {
        const stories = await loadStories();
        const bookHtml = stories.map(s => `
            <div class="book-card" onclick="alert('《${s.title}》\\n作者：${s.profiles?.username || '匿名'}\\n简介：${s.description || '暂无'}')">
                <img class="book-cover" src="${s.cover_url || '/books/default.jpg'}" onerror="this.src='/books/default.jpg'">
                <div class="book-info">
                    <div class="book-title">${s.title}</div>
                    <div class="book-author">${s.profiles?.username || '匿名'}</div>
                    <div class="book-desc">${s.description || ''}</div>
                </div>
            </div>
        `).join('');
        const emptyHtml = stories.length === 0 ? '<div style="text-align:center; padding:2rem;">暂无图书，欢迎创作者投稿</div>' : '';

        const isAdmin = currentProfile?.role === 'admin';
        const isEditor = currentProfile?.role === 'editor';

        document.getElementById('app').innerHTML = `
            <div class="navbar">
                <div class="logo">小鹰宇宙</div>
                <div class="nav-links">
                    <a href="#" id="homeLink">首页</a>
                    ${isEditor || isAdmin ? '<a href="#" id="editorLink">编者后台</a>' : ''}
                    ${isAdmin ? '<a href="#" id="adminLink">管理后台</a>' : ''}
                    <div class="user-info">
                        <span>${currentProfile?.username || currentUser.email}</span>
                        <span class="role-badge">${isAdmin ? '管理员' : (isEditor ? '编者' : '读者')}</span>
                        <button id="logoutBtn">退出</button>
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="hero">
                    <h1>故事创写平台</h1>
                    <p>发现精彩故事，创作你的世界</p>
                </div>
                <div class="book-grid">${bookHtml || emptyHtml}</div>
            </div>
            <div class="footer">小鹰宇宙 · 共创故事空间</div>
        `;

        document.getElementById('homeLink')?.addEventListener('click', (e) => { e.preventDefault(); renderHome(); });
        document.getElementById('editorLink')?.addEventListener('click', (e) => { e.preventDefault(); window.location.href = 'editor.html'; });
        document.getElementById('adminLink')?.addEventListener('click', (e) => { e.preventDefault(); window.location.href = 'admin.html'; });
        document.getElementById('logoutBtn')?.addEventListener('click', async () => { await supabase.auth.signOut(); location.reload(); });
    }

    async function init() {
        const { data: { user } } = await supabase.auth.getUser();
        currentUser = user;
        if (!user) { renderLogin(); return; }
        const { data: profile, error } = await supabase.from('profiles').select('role, username, bio').eq('id', user.id).single();
        if (error) console.error(error);
        currentProfile = profile || { role: 'reader', username: user.email.split('@')[0] };
        await renderHome();
    }
    init();
</script>
</body>
</html>
